document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x:hidden;-webkit-font-smoothing:antialiased;\">\n\n  <!-- ===================== NAV ===================== -->\n  <header style=\"position:sticky;top:0;z-index:50;background:rgba(251,247,218,0.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,175,55,0.28);\">\n    <nav style=\"max-width:1200px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <svg viewBox=\"0 0 200 200\" width=\"46\" height=\"46\" style=\"display:block;\">\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"5\"><\u002Frect>\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"5\" transform=\"rotate(45 100 100)\"><\u002Frect>\n          <circle cx=\"100\" cy=\"100\" r=\"42\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"2\" stroke-dasharray=\"4 4\"><\u002Fcircle>\n          <text x=\"100\" y=\"118\" text-anchor=\"middle\" font-family=\"Amiri,serif\" font-size=\"56\" font-weight=\"700\" fill=\"#04532F\">متقن<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"display:flex;flex-direction:column;line-height:1;\">\n          <span style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#04532F;\">مُتقِن<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:1px;color:#9A7A1E;margin-top:3px;\">منصة تحفيظ القرآن<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul style=\"display:flex;align-items:center;gap:34px;list-style:none;margin:0;padding:0;font-size:15px;font-weight:600;color:#1F5C3E;\">\n        <li style=\"cursor:pointer;\" style-hover=\"color:#9A7A1E;\">الرئيسية<\u002Fli>\n        <li style=\"cursor:pointer;\" style-hover=\"color:#9A7A1E;\">عن المنصة<\u002Fli>\n        <li style=\"cursor:pointer;\" style-hover=\"color:#9A7A1E;\">البرامج<\u002Fli>\n        <li style=\"cursor:pointer;\" style-hover=\"color:#9A7A1E;\">الرمز والاسم<\u002Fli>\n        <li style=\"cursor:pointer;\" style-hover=\"color:#9A7A1E;\">تواصل<\u002Fli>\n      <\u002Ful>\n      <a href=\"#\" style=\"text-decoration:none;background:#04532F;color:#FBF7DA;font-size:15px;font-weight:700;padding:11px 24px;border-radius:40px;border:1px solid #04532F;transition:all .2s;white-space:nowrap;\" style-hover=\"background:#D4AF37;border-color:#D4AF37;color:#04361F;\">ابدأ الآن<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- ===================== HERO ===================== -->\n  <section style=\"position:relative;max-width:1200px;margin:0 auto;padding:96px 32px 88px;display:grid;grid-template-columns:1.05fr 0.95fr;align-items:center;gap:48px;\">\n    <sc-if value=\"{{ showWatermark }}\" hint-placeholder-val=\"{{ true }}\">\n      <svg viewBox=\"0 0 200 200\" width=\"640\" height=\"640\" aria-hidden=\"true\" style=\"position:absolute;left:-180px;top:-60px;opacity:0.05;pointer-events:none;z-index:0;\">\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#04532F\" stroke-width=\"2\"><\u002Frect>\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#04532F\" stroke-width=\"2\" transform=\"rotate(45 100 100)\"><\u002Frect>\n        <circle cx=\"100\" cy=\"100\" r=\"42\" fill=\"none\" stroke=\"#04532F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fsc-if>\n\n    <div style=\"position:relative;z-index:1;\">\n      <div style=\"display:inline-flex;align-items:center;gap:10px;background:rgba(212,175,55,0.16);border:1px solid rgba(212,175,55,0.4);color:#9A7A1E;font-size:13px;font-weight:700;padding:8px 16px;border-radius:40px;margin-bottom:28px;\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#D4AF37;display:inline-block;\"><\u002Fspan>\n        على نهج الكتاتيب الليبية الأصيلة\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Amiri',serif;font-weight:700;font-size:64px;line-height:1.22;margin:0 0 24px;color:#04361F;letter-spacing:-0.5px;\">\n        إتقانٌ لكتابِ الله،<br><span style=\"color:#1F7A52;\">حرفًا حرفًا<\u002Fspan> ومخرجًا مخرجًا\n      <\u002Fh1>\n      <p style=\"font-size:19px;line-height:1.9;color:#3D6B52;max-width:520px;margin:0 0 38px;font-weight:500;\">\n        نمزج أصالة الكتاتيب الليبية بأدوات التعلّم الحديثة، لتُتقن تلاوة القرآن الكريم بأحكامه وضبطه ومخارج حروفه، حتى تصبح بإذن الله مِن المُتقِنين.\n      <\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;\">\n        <a href=\"#\" style=\"text-decoration:none;background:#04532F;color:#FBF7DA;font-size:16px;font-weight:700;padding:16px 34px;border-radius:44px;transition:all .2s;\" style-hover=\"background:#D4AF37;color:#04361F;\">ابدأ رحلتك في الحفظ<\u002Fa>\n        <a href=\"#\" style=\"text-decoration:none;color:#04532F;font-size:16px;font-weight:700;padding:16px 30px;border-radius:44px;border:1.5px solid rgba(4,83,47,0.25);transition:all .2s;\" style-hover=\"border-color:#04532F;background:rgba(4,83,47,0.05);\">تعرّف على البرامج<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:40px;margin-top:48px;padding-top:32px;border-top:1px solid rgba(212,175,55,0.3);\">\n        <div>\n          <div style=\"font-family:'Amiri',serif;font-size:34px;font-weight:700;color:#04532F;\">١٢٠٠+<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7A8F82;font-weight:600;margin-top:2px;\">طالب وطالبة<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Amiri',serif;font-size:34px;font-weight:700;color:#04532F;\">٤٠+<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7A8F82;font-weight:600;margin-top:2px;\">معلم مُجاز<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Amiri',serif;font-size:34px;font-weight:700;color:#04532F;\">٣١٥<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7A8F82;font-weight:600;margin-top:2px;\">ختمة مُتقَنة<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- hero logo mark -->\n    <div style=\"position:relative;z-index:1;display:flex;justify-content:center;align-items:center;\">\n      <div style=\"position:relative;width:420px;height:420px;display:flex;align-items:center;justify-content:center;\">\n        <svg viewBox=\"0 0 200 200\" width=\"380\" height=\"380\" aria-hidden=\"true\" style=\"position:absolute;animation:mtqnSpin 90s linear infinite;opacity:0.9;\">\n          <circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"0.6\" stroke-dasharray=\"2 5\"><\u002Fcircle>\n        <\u002Fsvg>\n        <svg viewBox=\"0 0 200 200\" width=\"320\" height=\"320\" style=\"position:relative;filter:drop-shadow(0 18px 40px rgba(4,54,31,0.18));\">\n          <circle cx=\"100\" cy=\"100\" r=\"58\" fill=\"#04532F\"><\u002Fcircle>\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3.4\"><\u002Frect>\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3.4\" transform=\"rotate(45 100 100)\"><\u002Frect>\n          <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"1.4\" stroke-dasharray=\"3.5 3.5\"><\u002Fcircle>\n          <circle cx=\"44\" cy=\"44\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"156\" cy=\"44\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"156\" cy=\"156\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"44\" cy=\"156\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"20\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"180\" cy=\"100\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"180\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"20\" cy=\"100\" r=\"3.4\" fill=\"#04532F\"><\u002Fcircle>\n          <text x=\"100\" y=\"118\" text-anchor=\"middle\" font-family=\"Amiri,serif\" font-size=\"62\" font-weight=\"700\" fill=\"#FBF7DA\">متقن<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== AYAH BANNER ===================== -->\n  <sc-if value=\"{{ showAyah }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"background:#04532F;color:#FBF7DA;padding:64px 32px;text-align:center;position:relative;overflow:hidden;\">\n      <svg viewBox=\"0 0 200 200\" width=\"240\" height=\"240\" aria-hidden=\"true\" style=\"position:absolute;right:5%;top:50%;transform:translateY(-50%);opacity:0.08;\">\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\"><\u002Frect>\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\" transform=\"rotate(45 100 100)\"><\u002Frect>\n      <\u002Fsvg>\n      <svg viewBox=\"0 0 200 200\" width=\"240\" height=\"240\" aria-hidden=\"true\" style=\"position:absolute;left:5%;top:50%;transform:translateY(-50%);opacity:0.08;\">\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\"><\u002Frect>\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\" transform=\"rotate(45 100 100)\"><\u002Frect>\n      <\u002Fsvg>\n      <p style=\"font-family:'Amiri',serif;font-size:42px;line-height:1.7;margin:0;font-weight:400;position:relative;z-index:1;\">﴿ وَرَتِّلِ القُرآنَ تَرتيلًا ﴾<\u002Fp>\n      <p style=\"color:#D4AF37;font-size:15px;font-weight:600;margin:16px 0 0;letter-spacing:1px;position:relative;z-index:1;\">سورة المُزَّمِّل — الآية ٤<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ===================== ABOUT / NAME ===================== -->\n  <section style=\"max-width:1200px;margin:0 auto;padding:104px 32px;display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;align-items:center;\">\n    <div style=\"position:relative;display:flex;justify-content:center;\">\n      <div style=\"background:#FFFFFF;border:1px solid rgba(212,175,55,0.3);border-radius:24px;padding:54px;box-shadow:0 30px 70px -40px rgba(4,54,31,0.4);position:relative;\">\n        <svg viewBox=\"0 0 200 200\" width=\"220\" height=\"220\" style=\"display:block;\">\n          <circle cx=\"100\" cy=\"100\" r=\"58\" fill=\"#FBF7DA\"><\u002Fcircle>\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3.4\"><\u002Frect>\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3.4\" transform=\"rotate(45 100 100)\"><\u002Frect>\n          <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"1.4\" stroke-dasharray=\"3.5 3.5\"><\u002Fcircle>\n          <circle cx=\"44\" cy=\"44\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle><circle cx=\"156\" cy=\"44\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"156\" cy=\"156\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle><circle cx=\"44\" cy=\"156\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"20\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle><circle cx=\"180\" cy=\"100\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"180\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle><circle cx=\"20\" cy=\"100\" r=\"3.2\" fill=\"#04532F\"><\u002Fcircle>\n          <text x=\"100\" y=\"116\" text-anchor=\"middle\" font-family=\"Amiri,serif\" font-size=\"56\" font-weight=\"700\" fill=\"#04532F\">متقن<\u002Ftext>\n        <\u002Fsvg>\n        <div style=\"position:absolute;bottom:-18px;right:50%;transform:translateX(50%);background:#D4AF37;color:#04361F;font-size:13px;font-weight:700;padding:8px 20px;border-radius:30px;white-space:nowrap;\">الشعار الأساسي<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <span style=\"display:block;font-size:14px;font-weight:700;color:#9A7A1E;letter-spacing:2px;margin-bottom:14px;\">فكرة الاسم<\u002Fspan>\n      <h2 style=\"font-family:'Amiri',serif;font-size:46px;font-weight:700;margin:0 0 24px;color:#04361F;line-height:1.3;\">لماذا \"مُتقِن\"؟<\u002Fh2>\n      <p style=\"font-size:18px;line-height:2;color:#3D6B52;margin:0 0 22px;font-weight:500;\">\n        اسمٌ مستوحى من الكتاتيب الليبية ومراكز التحفيظ، وهي كلمة تُطلَق على الشخص المُتمكِّن من قراءة القرآن بالطريقة الصحيحة، وضبطٍ للأحكام ومخارج الحروف — فيكون بذلك <span style=\"color:#04532F;font-weight:700;\">مُتقِنًا<\u002Fspan>.\n      <\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:32px;\">\n        <div style=\"display:flex;gap:16px;align-items:flex-start;\">\n          <span style=\"flex:none;width:38px;height:38px;border-radius:50%;background:rgba(4,83,47,0.08);color:#04532F;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Amiri',serif;font-size:18px;\">١<\u002Fspan>\n          <p style=\"margin:0;font-size:16px;line-height:1.75;color:#2E5C44;\"><strong style=\"color:#04361F;\">حفظٌ مُتقَن<\u002Fstrong> — لا نكتفي بالحفظ، بل نُرسّخه بالمراجعة والضبط.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;\">\n          <span style=\"flex:none;width:38px;height:38px;border-radius:50%;background:rgba(4,83,47,0.08);color:#04532F;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Amiri',serif;font-size:18px;\">٢<\u002Fspan>\n          <p style=\"margin:0;font-size:16px;line-height:1.75;color:#2E5C44;\"><strong style=\"color:#04361F;\">سندٌ متصل<\u002Fstrong> — تلقٍّ على أيدي معلمين مُجازين بالسند.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;\">\n          <span style=\"flex:none;width:38px;height:38px;border-radius:50%;background:rgba(4,83,47,0.08);color:#04532F;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Amiri',serif;font-size:18px;\">٣<\u002Fspan>\n          <p style=\"margin:0;font-size:16px;line-height:1.75;color:#2E5C44;\"><strong style=\"color:#04361F;\">أصالةٌ وحداثة<\u002Fstrong> — روح الكتّاب القديم بأدوات تعلّم اليوم.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== PROGRAMS ===================== -->\n  <section style=\"background:#FFFFFF;border-top:1px solid rgba(212,175,55,0.25);border-bottom:1px solid rgba(212,175,55,0.25);padding:104px 32px;\">\n    <div style=\"max-width:1200px;margin:0 auto;\">\n      <div style=\"text-align:center;max-width:640px;margin:0 auto 64px;\">\n        <span style=\"display:block;font-size:14px;font-weight:700;color:#9A7A1E;letter-spacing:2px;margin-bottom:14px;\">برامج المنصة<\u002Fspan>\n        <h2 style=\"font-family:'Amiri',serif;font-size:48px;font-weight:700;margin:0 0 18px;color:#04361F;\">رحلةٌ متكاملة نحو الإتقان<\u002Fh2>\n        <p style=\"font-size:18px;line-height:1.85;color:#3D6B52;margin:0;font-weight:500;\">مساراتٌ مُتدرّجة تأخذ بيدك من أول حرفٍ حتى الإجازة بالسند المتصل.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:24px;\">\n        <sc-for list=\"{{ programs }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"background:#FBF9E9;border:1px solid rgba(212,175,55,0.3);border-radius:20px;padding:38px;transition:all .25s;cursor:default;\" style-hover=\"border-color:#D4AF37;transform:translateY(-4px);box-shadow:0 22px 50px -34px rgba(4,54,31,0.5);\">\n            <div style=\"width:62px;height:62px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;position:relative;\">\n              <svg viewBox=\"0 0 60 60\" width=\"62\" height=\"62\" style=\"position:absolute;inset:0;\">\n                <rect x=\"13\" y=\"13\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"1.6\"><\u002Frect>\n                <rect x=\"13\" y=\"13\" width=\"34\" height=\"34\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"1.6\" transform=\"rotate(45 30 30)\"><\u002Frect>\n              <\u002Fsvg>\n              <span style=\"font-family:'Amiri',serif;font-size:24px;font-weight:700;color:#04532F;position:relative;\">{{ p.num }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family:'Amiri',serif;font-size:27px;font-weight:700;margin:0 0 12px;color:#04361F;\">{{ p.title }}<\u002Fh3>\n            <p style=\"font-size:16px;line-height:1.85;color:#3D6B52;margin:0;font-weight:500;\">{{ p.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== SYMBOL ===================== -->\n  <section style=\"max-width:1200px;margin:0 auto;padding:104px 32px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:64px;align-items:center;\">\n    <div>\n      <span style=\"display:block;font-size:14px;font-weight:700;color:#9A7A1E;letter-spacing:2px;margin-bottom:14px;\">الرمز<\u002Fspan>\n      <h2 style=\"font-family:'Amiri',serif;font-size:46px;font-weight:700;margin:0 0 24px;color:#04361F;line-height:1.3;\">النجمة الثُّمانية<\u002Fh2>\n      <p style=\"font-size:18px;line-height:2;color:#3D6B52;margin:0 0 30px;font-weight:500;\">\n        هي النجمة الموجودة في المصحف الليبي، والتي تدلّ على بداية الثُّمن أو الحِزب أو الجزء. اخترناها رمزًا لِمَا تحمله من أصالةٍ في صفحات المصحف، وإشارةٍ إلى التقسيم المنظَّم للحفظ والمراجعة.\n      <\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\">\n        <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"border-radius:16px;padding:22px 18px;border:1px solid rgba(212,175,55,0.3);background:#FFFFFF;\">\n            <span style=\"display:block;width:30px;height:30px;border-radius:8px;margin-bottom:14px;background:{{ c.swatch }};box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);\"><\u002Fspan>\n            <div style=\"font-family:'Amiri',serif;font-size:21px;font-weight:700;color:#04361F;margin-bottom:6px;\">{{ c.name }}<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.7;color:#5A7A66;margin:0;font-weight:500;\">{{ c.meaning }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:center;\">\n      <div style=\"position:relative;width:360px;height:360px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center, rgba(4,83,47,0.05), transparent 70%);\">\n        <svg viewBox=\"0 0 200 200\" width=\"320\" height=\"320\" aria-hidden=\"true\" style=\"position:absolute;animation:mtqnSpin 120s linear infinite;\">\n          <circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"0.6\" stroke-dasharray=\"1.5 6\"><\u002Fcircle>\n        <\u002Fsvg>\n        <svg viewBox=\"0 0 200 200\" width=\"270\" height=\"270\" style=\"position:relative;animation:mtqnFloat 7s ease-in-out infinite;\">\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\"><\u002Frect>\n          <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#04532F\" stroke-width=\"3\" transform=\"rotate(45 100 100)\"><\u002Frect>\n          <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"1.4\" stroke-dasharray=\"3.5 3.5\"><\u002Fcircle>\n          <circle cx=\"44\" cy=\"44\" r=\"4\" fill=\"#04532F\"><\u002Fcircle><circle cx=\"156\" cy=\"44\" r=\"4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"156\" cy=\"156\" r=\"4\" fill=\"#04532F\"><\u002Fcircle><circle cx=\"44\" cy=\"156\" r=\"4\" fill=\"#04532F\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"20\" r=\"4\" fill=\"#D4AF37\"><\u002Fcircle><circle cx=\"180\" cy=\"100\" r=\"4\" fill=\"#D4AF37\"><\u002Fcircle>\n          <circle cx=\"100\" cy=\"180\" r=\"4\" fill=\"#D4AF37\"><\u002Fcircle><circle cx=\"20\" cy=\"100\" r=\"4\" fill=\"#D4AF37\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== CTA ===================== -->\n  <section style=\"padding:0 32px 104px;\">\n    <div style=\"max-width:1100px;margin:0 auto;background:{{ ctaBg }};border-radius:32px;padding:80px 56px;text-align:center;position:relative;overflow:hidden;\">\n      <svg viewBox=\"0 0 200 200\" width=\"380\" height=\"380\" aria-hidden=\"true\" style=\"position:absolute;right:-90px;bottom:-120px;opacity:0.1;\">\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\"><\u002Frect>\n        <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"3\" transform=\"rotate(45 100 100)\"><\u002Frect>\n        <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"1.6\" stroke-dasharray=\"4 4\"><\u002Fcircle>\n      <\u002Fsvg>\n      <h2 style=\"font-family:'Amiri',serif;font-size:50px;font-weight:700;margin:0 0 20px;color:{{ ctaText }};position:relative;z-index:1;line-height:1.3;\">ابدأ طريقك إلى الإتقان اليوم<\u002Fh2>\n      <p style=\"font-size:19px;line-height:1.8;color:{{ ctaSub }};max-width:560px;margin:0 auto 38px;font-weight:500;position:relative;z-index:1;\">انضمّ إلى آلاف الطلاب الذين يحفظون كتاب الله ويُتقنونه على نهج الكتاتيب الأصيلة.<\u002Fp>\n      <div style=\"display:flex;gap:16px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;\">\n        <a href=\"#\" style=\"text-decoration:none;background:#D4AF37;color:#04361F;font-size:16px;font-weight:700;padding:16px 38px;border-radius:44px;transition:all .2s;\" style-hover=\"background:#FBF7DA;\">سجّل الآن مجانًا<\u002Fa>\n        <a href=\"#\" style=\"text-decoration:none;color:{{ ctaText }};font-size:16px;font-weight:700;padding:16px 32px;border-radius:44px;border:1.5px solid {{ ctaBorder }};transition:all .2s;\" style-hover=\"background:rgba(251,247,218,0.12);\">تحدّث إلى معلّم<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"background:#04361F;color:#C9D8CF;padding:64px 32px 32px;\">\n    <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(212,175,55,0.2);\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\">\n          <svg viewBox=\"0 0 200 200\" width=\"44\" height=\"44\">\n            <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"5\"><\u002Frect>\n            <rect x=\"44\" y=\"44\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#D4AF37\" stroke-width=\"5\" transform=\"rotate(45 100 100)\"><\u002Frect>\n            <text x=\"100\" y=\"118\" text-anchor=\"middle\" font-family=\"Amiri,serif\" font-size=\"54\" font-weight=\"700\" fill=\"#FBF7DA\">متقن<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"font-family:'Amiri',serif;font-size:26px;font-weight:700;color:#FBF7DA;\">مُتقِن<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.9;color:#9DB3A6;max-width:300px;margin:0;\">منصةٌ لتحفيظ القرآن الكريم وإتقان تلاوته، مستوحاةٌ من أصالة الكتاتيب الليبية.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"color:#D4AF37;font-size:14px;font-weight:700;margin:0 0 18px;letter-spacing:1px;\">المنصة<\u002Fh4>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:14.5px;\">\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">عن مُتقِن<\u002Fli>\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">البرامج<\u002Fli>\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">المعلمون<\u002Fli>\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">الأسعار<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"color:#D4AF37;font-size:14px;font-weight:700;margin:0 0 18px;letter-spacing:1px;\">روابط<\u002Fh4>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:14.5px;\">\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">الأسئلة الشائعة<\u002Fli>\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">المدوّنة<\u002Fli>\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">انضمّ كمعلّم<\u002Fli>\n          <li style=\"cursor:pointer;\" style-hover=\"color:#FBF7DA;\">تواصل معنا<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"color:#D4AF37;font-size:14px;font-weight:700;margin:0 0 18px;letter-spacing:1px;\">تواصل<\u002Fh4>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:14.5px;\">\n          <li>info@mutqin.ly<\u002Fli>\n          <li>طرابلس، ليبيا<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1200px;margin:24px auto 0;text-align:center;font-size:13px;color:#7E978A;\">© ٢٠٢٦ مُتقِن — جميع الحقوق محفوظة.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:&quot;auto&quot;},&quot;showWatermark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showAyah&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ctaTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;emerald&quot;,&quot;options&quot;:[&quot;emerald&quot;,&quot;gold&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const cta = this.props.ctaTheme ?? 'emerald';\n    const emerald = cta !== 'gold';\n    return {\n      showWatermark: this.props.showWatermark ?? true,\n      showAyah: this.props.showAyah ?? true,\n      ctaBg: emerald ? '#04532F' : '#D4AF37',\n      ctaText: emerald ? '#FBF7DA' : '#04361F',\n      ctaSub: emerald ? '#B7CDBF' : '#3A2E06',\n      ctaBorder: emerald ? 'rgba(212,175,55,0.5)' : 'rgba(4,54,31,0.4)',\n      programs: [\n        { num: '١', title: 'التحفيظ المُتقَن', desc: 'حفظٌ متدرّج بخطةٍ واضحة ومراجعةٍ منتظمة تُثبّت ما حفظت وتمنع النسيان.' },\n        { num: '٢', title: 'أحكام التجويد', desc: 'إتقان أحكام النون والميم والمدود وصفات الحروف عمليًّا مع التطبيق المباشر.' },\n        { num: '٣', title: 'مخارج الحروف', desc: 'نطقٌ سليم يضبط مخارج الحروف وصفاتها كما تلقّاها القرّاء جيلًا عن جيل.' },\n        { num: '٤', title: 'الإجازة والسند', desc: 'الوصول إلى الإجازة بالسند المتصل إلى رسول الله ﷺ على أيدي معلّمين مُجازين.' }\n      ],\n      colors: [\n        { name: 'الأخضر', swatch: '#006850', meaning: 'النماء والبهجة والسلام، وما يبعثه القرآن في القلب.' },\n        { name: 'الذهبي', swatch: '#D4AF37', meaning: 'الفخامة والنور المُنبعث من أحرف كلام الله جلّ جلاله.' },\n        { name: 'العاجي', swatch: '#FBF1B8', meaning: 'هدوءٌ يرمز للورق والمخطوطات القديمة وأصالة المصحف.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
