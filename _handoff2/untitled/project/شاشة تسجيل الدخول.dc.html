<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  @keyframes mtqnSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .mtqn-input::placeholder{color:#9DB3A6;font-weight:500;}
  .mtqn-input:focus{outline:none;border-color:#04532F!important;box-shadow:0 0 0 4px rgba(4,83,47,0.1);}
  ::selection{background:#D4AF37;color:#04361F;}
</style>
</helmet>

<div dir="rtl" lang="ar" style="font-family:'Cairo',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 30%, #0A6342 0%, #04532F 42%, #04361F 100%);-webkit-font-smoothing:antialiased;">

  <!-- decorative watermark stars -->
  <svg viewBox="0 0 200 200" width="520" height="520" aria-hidden="true" style="position:absolute;left:-160px;bottom:-160px;opacity:0.06;">
    <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="3" transform="rotate(45 100 100)"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="4 4"/>
  </svg>
  <svg viewBox="0 0 200 200" width="360" height="360" aria-hidden="true" style="position:absolute;right:-110px;top:-110px;opacity:0.06;">
    <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="3" transform="rotate(45 100 100)"/>
  </svg>

  <!-- card -->
  <div style="position:relative;z-index:1;width:100%;max-width:440px;background:#FFFFFF;border-radius:28px;padding:48px 44px 40px;box-shadow:0 40px 90px -30px rgba(0,0,0,0.45);border:1px solid rgba(212,175,55,0.35);">

    <!-- logo -->
    <div style="display:flex;justify-content:center;margin-bottom:24px;">
      <div style="position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 200 200" width="118" height="118" aria-hidden="true" style="position:absolute;animation:mtqnSpin 80s linear infinite;">
          <circle cx="100" cy="100" r="96" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 5"/>
        </svg>
        <svg viewBox="0 0 200 200" width="104" height="104" style="position:relative;">
          <circle cx="100" cy="100" r="56" fill="#FBF7DA"/>
          <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="3.6"/>
          <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="3.6" transform="rotate(45 100 100)"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3.5 3.5"/>
          <circle cx="44" cy="44" r="3.4" fill="#04532F"/><circle cx="156" cy="44" r="3.4" fill="#04532F"/>
          <circle cx="156" cy="156" r="3.4" fill="#04532F"/><circle cx="44" cy="156" r="3.4" fill="#04532F"/>
          <circle cx="100" cy="20" r="3.4" fill="#04532F"/><circle cx="180" cy="100" r="3.4" fill="#04532F"/>
          <circle cx="100" cy="180" r="3.4" fill="#04532F"/><circle cx="20" cy="100" r="3.4" fill="#04532F"/>
          <text x="100" y="116" text-anchor="middle" font-family="Amiri,serif" font-size="54" font-weight="700" fill="#04532F">متقن</text>
        </svg>
      </div>
    </div>

    <h1 style="font-family:'Amiri',serif;font-size:38px;font-weight:700;text-align:center;margin:0 0 8px;color:#04361F;">نظام مُتقِن</h1>
    <p style="text-align:center;font-size:15px;color:#3D6B52;margin:0 0 34px;font-weight:500;">لإدارة مراكز تحفيظ القرآن الكريم في ليبيا</p>

    <!-- username -->
    <label style="display:block;font-size:14.5px;font-weight:700;color:#04361F;margin-bottom:10px;">اسم المستخدم أو البريد الإلكتروني</label>
    <input class="mtqn-input" type="text" placeholder="admin@mutqin.ly أو parent.0913100001" style="width:100%;font-family:'Cairo',sans-serif;font-size:15px;color:#04361F;padding:15px 18px;border:1.5px solid rgba(4,83,47,0.22);border-radius:14px;background:#FBF9EE;transition:all .2s;margin-bottom:22px;">

    <!-- password -->
    <label style="display:block;font-size:14.5px;font-weight:700;color:#04361F;margin-bottom:10px;">كلمة المرور</label>
    <input class="mtqn-input" type="password" placeholder="••••••••" style="width:100%;font-family:'Cairo',sans-serif;font-size:15px;color:#04361F;padding:15px 18px;border:1.5px solid rgba(4,83,47,0.22);border-radius:14px;background:#FBF9EE;transition:all .2s;margin-bottom:20px;">

    <!-- remember + forgot -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;">
      <label style="display:flex;align-items:center;gap:9px;font-size:14px;color:#3D6B52;font-weight:600;cursor:pointer;">
        <span style="width:18px;height:18px;border-radius:5px;border:1.5px solid #04532F;display:inline-block;flex:none;"></span>
        تذكّرني
      </label>
      <a href="#" style="font-size:14px;color:#9A7A1E;font-weight:600;text-decoration:none;">نسيت كلمة المرور؟</a>
    </div>

    <!-- submit -->
    <button type="button" onClick="{{ onLogin }}" style="width:100%;font-family:'Cairo',sans-serif;font-size:17px;font-weight:700;color:#FBF7DA;background:#04532F;border:none;padding:17px;border-radius:14px;cursor:pointer;transition:all .2s;letter-spacing:0.3px;" style-hover="background:#D4AF37;color:#04361F;">تسجيل الدخول</button>

    <!-- footer -->
    <p style="text-align:center;font-size:12.5px;color:#9DB3A6;margin:30px 0 0;font-weight:500;">© ٢٠٢٦ مُتقِن — جميع الحقوق محفوظة</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:920,&quot;height&quot;:760}}">
class Component extends DCLogic {
  renderVals() {
    return { onLogin: () => {} };
  }
}
</script>
</body>
</html>
