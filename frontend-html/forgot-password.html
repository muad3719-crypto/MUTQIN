<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:40px 24px; }
  .fp-btn { transition:all .2s; }
  .fp-btn:hover { background:#D4AF37 !important; color:#04361F !important; }
  .mq-input { width:100%; }
</style>
</head>
<body>
<div style="width:100%;max-width:460px;background:#fff;border-radius:24px;padding:42px 40px;box-shadow:0 50px 110px -40px rgba(4,54,31,.5);border:1px solid rgba(212,175,55,.35);">
  <a href="login.html" style="display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#04532F;font-size:14px;font-weight:700;background:#FBF9EE;border:1px solid rgba(4,83,47,.18);padding:8px 16px;border-radius:30px;margin-bottom:22px;">
    <span style="font-size:16px;">→</span> العودة لتسجيل الدخول
  </a>

  <h2 style="font-family:'Amiri',serif;color:#04532F;font-size:26px;margin:0 0 6px;">استعادة كلمة المرور</h2>
  <p style="color:#7A8F82;font-size:14px;margin:0 0 22px;">لولي الأمر والمحفّظ — عبر رقم الهاتف المسجّل.</p>

  <div id="fp-alert" style="display:none;margin-bottom:16px;padding:12px 15px;border-radius:11px;font-size:13.5px;font-weight:600;"></div>

  <!-- الخطوة 1: رقم الهاتف -->
  <form id="step1">
    <label class="mq-label">رقم الهاتف المسجّل</label>
    <input class="mq-input" id="phone" placeholder="مثال: 0926000000" autocomplete="tel">
    <div class="mq-field-error" data-error="phone" style="color:#B23A48;font-size:12.5px;margin-top:4px;"></div>
    <button type="submit" class="fp-btn" style="width:100%;margin-top:18px;font-family:'Cairo';font-size:16px;font-weight:700;color:#FBF7DA;background:#04532F;border:none;padding:14px;border-radius:12px;cursor:pointer;">
      إرسال شفرة التحقّق
    </button>
  </form>

  <!-- الخطوة 2: الشفرة + كلمة المرور الجديدة -->
  <form id="step2" style="display:none;">
    <div style="background:#FBF9EE;border:1px solid rgba(4,83,47,.15);border-radius:11px;padding:11px 14px;font-size:13px;color:#3D6B52;margin-bottom:16px;">
      أُرسلت شفرة مكوّنة من 6 أرقام إلى صاحب الرقم <b id="fp-phone-echo" style="direction:ltr;display:inline-block;"></b>. أدخلها مع كلمة المرور الجديدة.
    </div>
    <label class="mq-label">شفرة التحقّق (OTP)</label>
    <input class="mq-input" id="otp" inputmode="numeric" maxlength="6" placeholder="------" style="letter-spacing:8px;text-align:center;font-weight:700;font-size:18px;">
    <div class="mq-field-error" data-error="otp" style="color:#B23A48;font-size:12.5px;margin-top:4px;"></div>

    <label class="mq-label" style="margin-top:14px;">كلمة المرور الجديدة</label>
    <input class="mq-input" id="new-password" type="password" placeholder="6 أحرف على الأقل">
    <div class="mq-field-error" data-error="password" style="color:#B23A48;font-size:12.5px;margin-top:4px;"></div>

    <button type="submit" class="fp-btn" style="width:100%;margin-top:18px;font-family:'Cairo';font-size:16px;font-weight:700;color:#FBF7DA;background:#04532F;border:none;padding:14px;border-radius:12px;cursor:pointer;">
      تحديث كلمة المرور
    </button>
    <button type="button" id="resend" style="width:100%;margin-top:10px;background:none;border:none;color:#9A7A1E;font-weight:600;font-size:13px;cursor:pointer;">تغيير الرقم / إعادة الإرسال</button>
  </form>

  <p style="text-align:center;font-size:12px;color:#9DB3A6;margin:24px 0 0;">© ٢٠٢٦ مُتقِن</p>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
    const step1 = document.getElementById('step1'), step2 = document.getElementById('step2');
    const alertEl = document.getElementById('fp-alert');
    let currentPhone = '';

    function showAlert(msg, kind) {
        const colors = { success: ['#04532F', 'rgba(4,83,47,.12)'], danger: ['#B23A48', 'rgba(178,58,72,.12)'], info: ['#9A7A1E', 'rgba(212,175,55,.16)'] };
        const [fg, bg] = colors[kind] || colors.info;
        alertEl.style.color = fg; alertEl.style.background = bg; alertEl.style.border = '1px solid ' + fg + '40';
        alertEl.innerHTML = msg; alertEl.style.display = 'block';
    }
    function clearErrors() { document.querySelectorAll('[data-error]').forEach(e => e.textContent = ''); }
    function setErrors(errors) { if (!errors) return; Object.keys(errors).forEach(k => { const b = document.querySelector(`[data-error="${k}"]`); if (b) b.textContent = Array.isArray(errors[k]) ? errors[k][0] : errors[k]; }); }

    // الخطوة 1: طلب الشفرة
    step1.addEventListener('submit', async (e) => {
        e.preventDefault(); clearErrors(); alertEl.style.display = 'none';
        const phone = document.getElementById('phone').value.trim();
        if (!phone) { setErrors({ phone: 'رقم الهاتف مطلوب' }); return; }
        const btn = step1.querySelector('button[type="submit"]'); btn.disabled = true;
        try {
            const res = await API.post('/auth/forgot-password/request', { phone });
            currentPhone = phone;
            document.getElementById('fp-phone-echo').textContent = phone;
            step1.style.display = 'none'; step2.style.display = 'block';
            // وضع التطوير: تُعرض الشفرة هنا ليُسلّمها الأدمن (لا توجد بوابة SMS فعلية)
            if (res.dev_otp) {
                showAlert('🔧 وضع التطوير — الشفرة: <b style="font-size:17px;direction:ltr;display:inline-block;letter-spacing:3px;">' + res.dev_otp + '</b><br><span style="font-weight:500;">' + (res.dev_note || '') + '</span>', 'info');
            } else {
                showAlert(res.message || 'إن كان الرقم مسجّلاً فستصل الشفرة.', 'success');
            }
        } catch (err) {
            if (err.errors) setErrors(err.errors);
            showAlert(err.message || 'تعذّر إرسال الطلب', 'danger');
        } finally { btn.disabled = false; }
    });

    // الخطوة 2: التحقّق وتعيين كلمة جديدة
    step2.addEventListener('submit', async (e) => {
        e.preventDefault(); clearErrors();
        const otp = document.getElementById('otp').value.trim();
        const password = document.getElementById('new-password').value;
        const btn = step2.querySelector('button[type="submit"]'); btn.disabled = true;
        try {
            const res = await API.post('/auth/forgot-password/verify', { phone: currentPhone, otp, password });
            showAlert('✓ ' + (res.message || 'تم التحديث') + ' <a href="login.html" style="color:#04532F;font-weight:700;">اذهب لتسجيل الدخول</a>', 'success');
            step2.style.display = 'none';
        } catch (err) {
            if (err.errors) setErrors(err.errors);
            showAlert('✕ ' + (err.message || 'الشفرة غير صحيحة أو منتهية'), 'danger');
        } finally { btn.disabled = false; }
    });

    document.getElementById('resend').addEventListener('click', () => {
        step2.style.display = 'none'; step1.style.display = 'block'; alertEl.style.display = 'none';
    });
})();
</script>
</body>
</html>
