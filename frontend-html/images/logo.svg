<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- النجمة الثُّمانية — هوية "مُتقِن" -->
  <!-- المربعان المتقاطعان -->
  <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="4"/>
  <rect x="44" y="44" width="112" height="112" fill="none" stroke="#D4AF37" stroke-width="4" transform="rotate(45 100 100)"/>
  <!-- الدائرة المنقطة الداخلية -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="3.5 3.5"/>
  <!-- نقاط الزوايا الثماني -->
  <circle cx="44"  cy="44"  r="3.6" fill="#D4AF37"/>
  <circle cx="156" cy="44"  r="3.6" fill="#D4AF37"/>
  <circle cx="156" cy="156" r="3.6" fill="#D4AF37"/>
  <circle cx="44"  cy="156" r="3.6" fill="#D4AF37"/>
  <circle cx="100" cy="20"  r="3.6" fill="#D4AF37"/>
  <circle cx="180" cy="100" r="3.6" fill="#D4AF37"/>
  <circle cx="100" cy="180" r="3.6" fill="#D4AF37"/>
  <circle cx="20"  cy="100" r="3.6" fill="#D4AF37"/>
  <!-- اسم العلامة -->
  <text x="100" y="118" text-anchor="middle" font-family="Amiri, serif" font-size="58" font-weight="700" fill="#D4AF37">متقن</text>
</svg>
