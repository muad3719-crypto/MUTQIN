<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    const user = Auth.requireAuth(['teacher', 'admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'reports', title: 'التقارير' });

    const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const now = new Date(), curM = now.getMonth() + 1, curY = now.getFullYear();
    const monthOpts = MONTHS.map((m, i) => `<option value="${i+1}" ${i+1===curM?'selected':''}>${m}</option>`).join('');
    const yearOpts = [0,1,2].map(k => curY-k).map(y => `<option value="${y}">${y}</option>`).join('');
    const filters = (p) => `
        <label class="mq-label" style="margin:0;">الشهر</label>
        <select class="mq-input" id="${p}-m" style="max-width:150px;">${monthOpts}</select>
        <label class="mq-label" style="margin:0;">السنة</label>
        <select class="mq-input" id="${p}-y" style="max-width:120px;">${yearOpts}</select>`;
    const my = (p) => `month=${document.getElementById(p+'-m').value}&year=${document.getElementById(p+'-y').value}`;

    pc.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

        <div class="mq-card"><div class="mq-card-body">
          <h3 class="mq-card-title" style="margin-bottom:6px;">📄 تقرير طالب</h3>
          <p style="color:#7A8F82;font-size:13px;margin:0 0 16px;">حضور الطالب وحفظه واختباراته وأثمانه خلال الشهر — ملف PDF.</p>
          <label class="mq-label">الطالب</label>
          <select class="mq-input" id="st-id" style="margin-bottom:12px;"><option value="">جارٍ التحميل...</option></select>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">${filters('st')}</div>
          <button class="mq-btn mq-btn-primary mq-btn-block" id="btn-student">${UI.ic('report',17)} فتح تقرير الطالب (PDF)</button>
        </div></div>

        <div class="mq-card"><div class="mq-card-body">
          <h3 class="mq-card-title" style="margin-bottom:6px;">👥 تقرير كل طلابي</h3>
          <p style="color:#7A8F82;font-size:13px;margin:0 0 16px;">جدول بكل طلابك مع نسبة الحضور ونسبة النجاح للشهر — ملف PDF.</p>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">${filters('gr')}</div>
          <button class="mq-btn mq-btn-primary mq-btn-block" id="btn-group">${UI.ic('report',17)} فتح تقرير المجموعة (PDF)</button>
        </div></div>

      </div>`;

    // تعبئة قائمة الطلاب
    try {
        const res = await API.get('/students?all=1');
        const students = res.data.data || res.data || [];
        document.getElementById('st-id').innerHTML = students.length
            ? students.map(s => `<option value="${s.id}">${UI.escapeHtml(s.name)}</option>`).join('')
            : '<option value="">لا يوجد طلاب</option>';
    } catch (e) { UI.toast(e.message, 'danger'); }

    document.getElementById('btn-student').onclick = () => {
        const id = document.getElementById('st-id').value;
        if (!id) { UI.toast('اختر طالباً أولاً', 'warning'); return; }
        UI.openPdf(`/reports/student/${id}/pdf?${my('st')}`);
    };
    document.getElementById('btn-group').onclick = () => UI.openPdf(`/reports/teacher/pdf?${my('gr')}`);
})();
</script>
</body>
</html>
