<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلم | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    const user = Auth.requireAuth(['teacher', 'admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'dashboard', title: 'لوحة تحكمي' });

    try {
        const res = await API.get('/dashboard');
        const d = res.data, s = d.stats;
        const stat = (v, l, i, k) => `<div class="mq-stat ${k}"><span class="mq-stat-ico">${UI.star(22)}</span><div><div class="mq-stat-val">${v}</div><div class="mq-stat-lbl">${l}</div></div></div>`;

        const students = (d.students || []).slice(0, 8).map(st =>
            `<tr><td><div style="display:flex;align-items:center;gap:10px;"><span class="mq-avatar">${UI.initial(st.name)}</span>${UI.escapeHtml(st.name)}</div></td><td>${st.age ?? '—'}</td></tr>`
        ).join('') || `<tr><td colspan="2" style="text-align:center;color:#7A8F82;padding:24px;">لا يوجد طلاب</td></tr>`;

        const memos = (d.recentMemorizations || []).map(m =>
            `<tr><td>${UI.escapeHtml(m.student?.name || '')}</td><td>${UI.escapeHtml(m.surah_name)}</td><td>${UI.qualityBadge(m.quality)}</td></tr>`
        ).join('') || `<tr><td colspan="3" style="text-align:center;color:#7A8F82;padding:24px;">لا توجد سجلات</td></tr>`;

        const alert = (!d.attendanceToday && s.total_students > 0)
            ? `<div class="alert" style="background:rgba(212,175,55,.16);color:#9A7A1E;border-right:4px solid #9A7A1E;padding:14px 18px;border-radius:12px;font-weight:600;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;">
                 ⚠️ لم تُسجّل الحضور اليوم بعد <a class="mq-btn mq-btn--primary mq-btn--sm" href="attendance.html">تسجيل الآن</a></div>` : '';

        pc.innerHTML = `
            ${alert}
            <div class="mq-stats">
              ${stat(s.total_students, 'طلابي', '👥', 'gold')}
              ${stat(s.today_present, 'حاضر اليوم', '✅', 'green')}
              ${stat(s.today_absent, 'غائب اليوم', '❌', 'red')}
              ${stat(s.today_late, 'متأخر اليوم', '⏰', 'orange')}
              ${stat(s.this_week_memorizations, 'حفظ الأسبوع', '📖', 'blue')}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
              <div class="mq-card"><div class="mq-card-header"><h3 class="mq-card-title">طلابي</h3>
                <a class="mq-btn mq-btn--secondary mq-btn--sm" href="students.html">الكل</a></div>
                <table class="mq-table"><thead><tr><th>الاسم</th><th>العمر</th></tr></thead><tbody>${students}</tbody></table></div>
              <div class="mq-card"><div class="mq-card-header"><h3 class="mq-card-title">آخر سجلات الحفظ</h3>
                <a class="mq-btn mq-btn--primary mq-btn--sm" href="memorization.html">+ تسجيل</a></div>
                <table class="mq-table"><thead><tr><th>الطالب</th><th>السورة</th><th>التقييم</th></tr></thead><tbody>${memos}</tbody></table></div>
            </div>`;
    } catch (e) { UI.toast(e.message, 'danger'); }
})();
</script>
</body>
</html>
