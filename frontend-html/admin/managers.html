<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدراء المراكز | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'supervisors', title: 'مدراء المراكز' });
    let centers = [], managers = [];

    // المراكز التي «بلا مدير» (لخيارات الإضافة/النقل) — يستثنى مركز المدير المحرَّر نفسه
    function centersWithoutManager(exceptManagerId) {
        const taken = new Set(managers.filter(m => m.id !== exceptManagerId).map(m => m.center_id));
        return centers.filter(c => !taken.has(c.id));
    }

    function addFields() {
        const opts = centersWithoutManager(null);
        return [
            { name: 'name', label: 'اسم مدير المركز', required: true },
            { name: 'email_prefix', label: 'الاسم اللاتيني', required: true, placeholder: 'مثال: muad' },
            { name: 'phone', label: 'رقم الهاتف' },
            { name: 'center_id', label: 'المركز (بلا مدير فقط)', type: 'select', required: true,
              options: opts.map(c => ({ value: c.id, label: c.name })) },
            { name: 'password', label: 'كلمة المرور (مطلوبة)', type: 'password', required: true, help: 'لا توليد تلقائياً — حدّدها وسلّمها للمدير' },
            { name: 'password_confirmation', label: 'تأكيد كلمة المرور', type: 'password', required: true },
        ];
    }
    function editFields(m) {
        const opts = centersWithoutManager(m.id);
        return [
            { name: 'name', label: 'اسم مدير المركز', required: true, value: m.name },
            { name: 'email', label: 'البريد الإلكتروني', type: 'email', required: true, value: m.email },
            { name: 'phone', label: 'رقم الهاتف', value: m.phone },
            { name: 'center_id', label: 'المركز (النقل لمركز بلا مدير)', type: 'select', required: true,
              options: opts.map(c => ({ value: c.id, label: c.name })), value: m.center_id },
            { name: 'password', label: 'كلمة مرور جديدة (اختياري)', type: 'password' },
            { name: 'password_confirmation', label: 'تأكيد كلمة المرور', type: 'password' },
        ];
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const [mRes, cRes] = await Promise.all([API.get('/admin/managers'), API.get('/centers?all=1&active=1')]);
            managers = mRes.data || [];
            centers = cRes.data.data || cRes.data || [];

            const rows = managers.map(m => `
                <tr>
                  <td><div style="display:flex;align-items:center;gap:10px;">
                    <span class="mq-avatar">${UI.initial(m.name)}</span>
                    <div><div style="font-weight:600;">${UI.escapeHtml(m.name)}</div>
                    <div style="font-size:12px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(m.email)}</div></div></div></td>
                  <td>${m.display_code ? `<span class="mq-code">${UI.escapeHtml(m.display_code)}</span>` : '—'}</td>
                  <td>${UI.badge(UI.escapeHtml(m.center?.name || '—'), 'info')}</td>
                  <td style="white-space:nowrap;">${UI.fmtDate(m.created_at)}</td>
                  <td style="text-align:center;">${m.is_active ? UI.badge('نشط', 'success') : UI.badge('غير نشط', 'danger')}</td>
                  <td><div class="mq-actions">
                    ${UI.actionBtn('edit', `data-edit="${m.id}" title="تعديل"`)}
                    <button class="mq-btn ${m.is_active ? 'mq-btn--quiet-danger' : 'mq-btn--quiet'} mq-btn--icon mq-btn--sm"
                            data-toggle="${m.id}" title="${m.is_active ? 'تعطيل الحساب' : 'تفعيل الحساب'}">
                      ${m.is_active
                        ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>'
                        : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>'}
                    </button>
                  </div></td>
                </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">لا يوجد مدراء مراكز بعد</td></tr>`;

            pc.innerHTML = `
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="بحث بالاسم أو المركز..."></div>
                  <button class="mq-btn mq-btn--primary" id="add">${UI.ic('plus', 17)} إضافة مدير مركز</button>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>مدير المركز</th><th style="width:110px;">رقم مدير المركز</th><th>المركز</th><th>تاريخ الإنشاء</th><th style="width:100px;text-align:center;">الحالة</th><th style="width:110px;">الإجراءات</th></tr></thead>
                  <tbody>${rows}</tbody></table></div>`;

            UI.bindTableSearch('search', 'tbl');
            document.getElementById('add').onclick = () => {
                if (!centersWithoutManager(null).length) { UI.toast('كل المراكز لها مدراء بالفعل', 'warning'); return; }
                UI.formModal({
                    title: 'إضافة مدير مركز', submitText: 'إنشاء', fields: addFields(),
                    onMount: (form) => {
                        // معاينة حيّة للبريد النهائي + تنظيف تلقائي لمن يلصق البريد كاملاً
                        const inp = form.querySelector('[name="email_prefix"]');
                        const preview = document.createElement('div');
                        preview.style.cssText = 'font-size:12.5px;color:#04532F;font-weight:700;margin-top:5px;direction:ltr;text-align:right;';
                        inp.parentElement.insertBefore(preview, inp.nextSibling);
                        const refresh = () => {
                            let v = inp.value.toLowerCase().trim().replace(/@.*$/, '').replace(/\.centeradmin$/, '');
                            if (v !== inp.value) inp.value = v; // نظّف الإدخال في مكانه
                            preview.textContent = v ? v + '.centeradmin@mutqin.ly' : '';
                            preview.style.display = v ? '' : 'none';
                        };
                        inp.addEventListener('input', refresh);
                        refresh();
                    },
                    onSubmit: async (v, h) => {
                        const res = await API.post('/admin/managers', v);
                        UI.toast(res.message || 'تم الإنشاء'); h.close(); load();
                    }
                });
            };
            pc.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
                const m = managers.find(x => x.id == b.dataset.edit);
                UI.formModal({
                    title: 'تعديل مدير المركز', submitText: 'حفظ التعديلات', fields: editFields(m),
                    onMount: (form) => {
                        // رقم مدير المركز للعرض فقط — يولّده النظام ولا يُعدَّل
                        const box = document.createElement('div');
                        box.style.cssText = 'margin-bottom:14px;';
                        box.innerHTML = `<label class="mq-label">رقم مدير المركز</label>
                          <div style="display:flex;align-items:center;gap:8px;">
                            <span class="mq-code">${UI.escapeHtml(m.display_code || '—')}</span>
                            <span style="font-size:12px;color:#7A8F82;">رقم ثابت يولّده النظام — غير قابل للتعديل</span>
                          </div>`;
                        form.insertBefore(box, form.firstChild);
                    },
                    onSubmit: async (v, h) => { await API.put('/admin/managers/' + m.id, v); UI.toast('تم التحديث'); h.close(); load(); }
                });
            });
            // تفعيل/تعطيل — بديل الحذف: البيانات والارتباطات التاريخية تبقى
            pc.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
                const m = managers.find(x => x.id == b.dataset.toggle);
                const deact = !!m.is_active;
                const centerName = UI.escapeHtml(m.center?.name || 'مركزه');
                const html = deact
                    ? `تعطيل حساب <strong>${UI.escapeHtml(m.name)}</strong>؟<br>`
                      + `<span style="color:#B23A48;font-weight:700;">لن يستطيع تسجيل الدخول، وتُنهى جلساته فوراً.</span>`
                      // القاعدة: مدير واحد لكل مركز — فالتعطيل يترك المركز بلا مدير نشط دائماً
                      + `<div style="margin-top:10px;background:rgba(212,175,55,.16);border:1.5px solid #D4AF37;border-radius:10px;padding:10px 13px;font-size:13px;color:#9A7A1E;font-weight:700;">`
                      + `⚠ سيبقى مركز «${centerName}» <u>بلا مدير نشط</u> — وتؤول طلبات النقل الداخلية المعلّقة والجديدة إلى مدير النظام.</div>`
                      + `<span style="color:#7A8F82;font-size:13px;">تبقى كل بياناته وارتباطاته التاريخية كما هي، ويمكن إعادة تفعيله لاحقاً.</span>`
                    : `تفعيل حساب <strong>${UI.escapeHtml(m.name)}</strong>؟<br>`
                      + `<span style="color:#7A8F82;">سيعود لإدارة مركز «${centerName}» وتُوجَّه إليه طلباته الداخلية من جديد.</span>`;
                const ok = await UI.confirmAction({
                    title: deact ? 'تعطيل حساب مدير المركز' : 'تفعيل حساب مدير المركز',
                    html, okText: deact ? 'تأكيد التعطيل' : 'تأكيد التفعيل', cancelText: 'إلغاء',
                });
                if (!ok) return;
                try {
                    const r = await API.put('/admin/managers/' + m.id + '/status', { is_active: !m.is_active });
                    UI.toast(r.message || 'تم تحديث الحالة');
                    load();
                } catch (e) { UI.toast(e.message, 'danger'); }
            });
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>
