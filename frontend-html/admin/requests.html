<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'requests', title: 'طلبات الطلاب' });

    let statusFilter = 'pending';

    const typeBadge = (t) => t === 'transfer' ? UI.badge('نقل', 'primary') : UI.badge('إضافة', 'info');
    const statusBadge = (s) => ({
        pending:  UI.badge('قيد المراجعة', 'warning'),
        approved: UI.badge('موافَق عليه', 'success'),
        rejected: UI.badge('مرفوض', 'danger'),
    }[s] || UI.badge(s, 'secondary'));

    // ===== نافذة رفض (سبب اختياري) =====
    function openReject(id) {
        UI.formModal({
            title: 'رفض الطلب',
            submitText: 'تأكيد الرفض',
            fields: [
                { name: 'admin_note', label: 'سبب الرفض (اختياري)', type: 'textarea', placeholder: 'مثال: بيانات غير مكتملة...' },
            ],
            onSubmit: async (v, h) => {
                await API.post('/admin/student-requests/' + id + '/reject', v);
                UI.toast('تم رفض الطلب');
                h.close(); load();
            }
        });
    }

    async function approve(id) {
        if (!window.confirm('الموافقة ستُنفّذ التغيير فعلياً على الطلاب. تأكيد؟')) return;
        try {
            const res = await API.post('/admin/student-requests/' + id + '/approve', {});
            UI.toast(res.message || 'تمت الموافقة');
            load();
        } catch (e) { UI.toast(e.message, 'danger'); }
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const res = await API.get('/admin/student-requests?status=' + statusFilter);
            const reqs = res.data || [];
            const rows = reqs.map(r => `
                <tr>
                  <td>${typeBadge(r.type)}</td>
                  <td><div style="font-weight:600;">${UI.escapeHtml(r.student_name || '—')}</div>
                    <div style="font-size:12px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(r.national_id || '—')}</div></td>
                  <td>${UI.escapeHtml(r.requested_by || '—')}</td>
                  <td>${UI.escapeHtml((r.target_center || '—') + ' / ' + (r.target_teacher || '—'))}</td>
                  <td>${r.type === 'transfer' ? UI.escapeHtml((r.from_center || '—') + ' / ' + (r.from_teacher || '—')) : '—'}</td>
                  <td style="white-space:nowrap;">${UI.fmtDate(r.created_at)}</td>
                  <td>${r.status === 'pending'
                        ? `<div class="mq-actions">
                             <button class="mq-btn mq-btn-primary mq-btn-sm" data-approve="${r.id}">موافقة</button>
                             <button class="mq-btn mq-btn-outline mq-btn-sm" data-reject="${r.id}">رفض</button>
                           </div>`
                        : statusBadge(r.status) + (r.status === 'rejected' && r.admin_note ? `<div style="font-size:12px;color:#B23A48;margin-top:4px;">${UI.escapeHtml(r.admin_note)}</div>` : '')}</td>
                </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:#7A8F82;padding:30px;">لا توجد طلبات</td></tr>`;

            const tab = (key, label) => `<button class="mq-btn ${statusFilter === key ? 'mq-btn-primary' : 'mq-btn-outline'} mq-btn-sm" data-tab="${key}">${label}</button>`;

            pc.innerHTML = `
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="بحث..."></div>
                  <div style="display:flex;gap:8px;">
                    ${tab('pending', 'قيد المراجعة')}
                    ${tab('all', 'الكل')}
                  </div>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>النوع</th><th>الطالب</th><th>المحفّظ الطالب</th><th>الوجهة (مركز/محفّظ)</th><th>المصدر (نقل)</th><th>التاريخ</th><th>الإجراء</th></tr></thead>
                  <tbody>${rows}</tbody></table></div>`;

            UI.bindTableSearch('search', 'tbl');
            pc.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { statusFilter = b.dataset.tab; load(); });
            pc.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approve(b.dataset.approve));
            pc.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => openReject(b.dataset.reject));
        } catch (e) { UI.toast(e.message, 'danger'); }
    }

    load();
})();
</script>
</body>
</html>
