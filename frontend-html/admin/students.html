<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلاب | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'students', title: 'إدارة الطلاب' });
    let centers = [], teachers = [];

    const centerOpts = () => centers.map(c => ({ value: c.id, label: c.name }));
    const teacherOpts = () => [{ value: '', label: '— بدون معلم —' }].concat(teachers.map(t => ({ value: t.id, label: t.name })));

    // قائمة المحفّظ تابعة للمركز: تُملأ بمحفّظي المركز المختار فقط (role=teacher + center_id)
    async function fillTeachersByCenter(root, centerId, selected) {
        const sel = root.querySelector('[name="teacher_id"]');
        if (!sel) return;
        if (!centerId) { sel.innerHTML = '<option value="">اختر المركز أولاً</option>'; sel.disabled = true; return; }
        sel.disabled = true; sel.innerHTML = '<option value="">جارٍ التحميل...</option>';
        try {
            const res = await API.get('/teachers?all=1&center_id=' + encodeURIComponent(centerId));
            const list = res.data.data || res.data || [];
            sel.innerHTML = '<option value="">— بدون معلم —</option>' + list.map(t =>
                `<option value="${t.id}" ${String(t.id) === String(selected || '') ? 'selected' : ''}>${UI.escapeHtml(t.name)}</option>`).join('');
        } catch (e) { sel.innerHTML = '<option value="">— بدون معلم —</option>'; }
        sel.disabled = false;
    }
    // يربط قائمة المركز بقائمة المحفّظ داخل أي نموذج (إضافة/تعديل)
    function wireTeacherByCenter(root, selectedTeacherId) {
        const centerSel = root.querySelector('[name="center_id"]');
        if (!centerSel) return;
        centerSel.addEventListener('change', () => fillTeachersByCenter(root, centerSel.value, null));
        fillTeachersByCenter(root, centerSel.value, selectedTeacherId); // تهيئة أولية
    }

    // نموذج الإضافة — يشمل حقول ولي الأمر (تُنشئ/تربط حساب parent)
    const NAT_ID_HELP = 'اختياري الآن — رقم وطني ليبي: 12 رقماً يبدأ بـ 1 (ذكر) أو 2 (أنثى). يُستخدم لتقارير وزارة الأوقاف ولمطابقة البصمة.';
    function addFields() {
        return [
            { name: 'name', label: 'اسم الطالب', required: true },
            { name: 'national_id', label: 'الرقم الوطني (اختياري)', placeholder: 'مثال: 199000000001', help: NAT_ID_HELP },
            { name: 'center_id', label: 'المركز', type: 'select', required: true, options: centerOpts() },
            { name: 'teacher_id', label: 'المعلم', type: 'select', options: teacherOpts() },
            { name: 'age', label: 'العمر', type: 'number' },
            { name: 'phone', label: 'هاتف الطالب' },
            { name: 'guardian_name', label: 'اسم ولي الأمر', required: true },
            { name: 'guardian_email', label: 'بريد ولي الأمر', type: 'email', required: true, help: 'يُنشأ به حساب دخول لولي الأمر' },
            { name: 'guardian_phone', label: 'هاتف ولي الأمر' },
            { name: 'guardian_password', label: 'كلمة مرور ولي الأمر', type: 'password', help: 'إن تُركت فارغة: password' },
        ];
    }
    // نموذج التعديل/النقل بين المعلمين
    function editFields(s) {
        return [
            { name: 'name', label: 'اسم الطالب', required: true, value: s.name },
            { name: 'nationality_type', label: 'الجنسية', type: 'select', value: s.nationality_type || 'libyan',
              options: [{ value: 'libyan', label: 'ليبي' }, { value: 'foreigner', label: 'أجنبي' }] },
            { name: 'nationality_name', label: 'اسم الجنسية', placeholder: 'مثال: مصر', value: s.nationality_name },
            { name: 'national_id', label: 'الرقم الوطني (اختياري)', placeholder: 'مثال: 199000000001', help: NAT_ID_HELP, value: s.national_id },
            { name: 'center_id', label: 'المركز', type: 'select', required: true, options: centerOpts(), value: s.center_id },
            { name: 'teacher_id', label: 'المعلم (النقل)', type: 'select', options: teacherOpts(), value: s.teacher_id },
            { name: 'age', label: 'العمر', type: 'number', value: s.age },
            { name: 'phone', label: 'هاتف الطالب', value: s.phone },
        ];
    }
    // إظهار «اسم الجنسية» وتغيير تسمية الرقم في نموذج التعديل حسب الجنسية
    function wireEditNat(form) {
        const sel = form.querySelector('[name="nationality_type"]');
        if (!sel) return;
        const natNameWrap = form.querySelector('[data-error="nationality_name"]').parentElement;
        const idLabel = form.querySelector('[data-error="national_id"]').parentElement.querySelector('label');
        const apply = () => {
            const foreign = sel.value === 'foreigner';
            natNameWrap.style.display = foreign ? '' : 'none';
            idLabel.textContent = foreign ? 'رقم الجواز/الإقامة (اختياري)' : 'الرقم الوطني (اختياري)';
        };
        sel.onchange = apply; apply();
    }

    // ===== نموذج إضافة طالب مع اختيار ولي الأمر (جديد / موجود / بدون) =====
    function openAddStudent() {
        let chosenParent = null;            // ولي الأمر المختار (الوضع B)
        const ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;z-index:1500;background:rgba(4,54,31,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;';
        const inp = (name, label, opts = {}) => `
            <div style="margin-bottom:13px;">
              <label class="mq-label">${label} ${opts.req ? '<span style="color:#B23A48;">*</span>' : ''}</label>
              ${opts.type === 'select'
                ? `<select class="mq-input" name="${name}">${opts.options}</select>`
                : `<input class="mq-input" name="${name}" type="${opts.type || 'text'}" placeholder="${opts.ph || ''}">`}
              ${opts.help ? `<div style="font-size:12px;color:#7A8F82;margin-top:4px;">${opts.help}</div>` : ''}
              <div class="mq-field-error" data-error="${name}"></div>
            </div>`;

        ov.innerHTML = `
          <div class="mq-card" style="width:100%;max-width:640px;max-height:92vh;overflow:auto;margin:0;">
            <div class="mq-card-header"><h3 class="mq-card-title">إضافة طالب جديد</h3>
              <button class="mq-act" data-close style="background:rgba(4,54,31,.06);color:#3D6B52;font-size:20px;">×</button></div>
            <form class="mq-card-body" id="add-form">
              ${inp('name', 'اسم الطالب', { req: true })}
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div style="margin-bottom:13px;">
                  <label class="mq-label">الجنسية</label>
                  <select class="mq-input" name="nationality_type" id="s-nat">
                    <option value="libyan">ليبي</option><option value="foreigner">أجنبي</option>
                  </select>
                </div>
                <div style="margin-bottom:13px;display:none;" id="s-natname-wrap">
                  <label class="mq-label">اسم الجنسية <span style="color:#B23A48;">*</span></label>
                  <input class="mq-input" name="nationality_name" placeholder="مثال: مصر، تشاد، السودان">
                  <div class="mq-field-error" data-error="nationality_name"></div>
                </div>
              </div>
              <div style="margin-bottom:13px;">
                <label class="mq-label" id="s-idlabel">الرقم الوطني (اختياري)</label>
                <input class="mq-input" name="national_id" placeholder="مثال: 199000000001">
                <div style="font-size:12px;color:#7A8F82;margin-top:4px;" id="s-idhelp">${NAT_ID_HELP}</div>
                <div class="mq-field-error" data-error="national_id"></div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                ${inp('center_id', 'المركز', { req: true, type: 'select', options: '<option value="">— اختر المركز —</option>' + centerOpts().map(o => `<option value="${o.value}">${UI.escapeHtml(o.label)}</option>`).join('') })}
                ${inp('teacher_id', 'المعلم', { type: 'select', options: '<option value="">اختر المركز أولاً</option>' })}
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                ${inp('age', 'العمر', { type: 'number' })}
                ${inp('phone', 'هاتف الطالب')}
              </div>

              <div style="border-top:1px solid var(--line);margin:6px 0 14px;"></div>
              <label class="mq-label">ولي الأمر</label>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
                <label class="gmode" style="cursor:pointer;"><input type="radio" name="gmode" value="new" checked style="margin-left:5px;">ولي أمر جديد</label>
                <label class="gmode" style="cursor:pointer;"><input type="radio" name="gmode" value="existing" style="margin-left:5px;">ولي أمر موجود</label>
                <label class="gmode" style="cursor:pointer;"><input type="radio" name="gmode" value="none" style="margin-left:5px;">بدون ولي أمر</label>
              </div>

              <div id="gm-new">
                ${inp('guardian_name', 'اسم ولي الأمر')}
                ${inp('guardian_email', 'بريد ولي الأمر', { type: 'email', help: 'يُنشأ به حساب دخول لولي الأمر' })}
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  <div style="margin-bottom:13px;">
                    <label class="mq-label">جنسية ولي الأمر</label>
                    <select class="mq-input" name="guardian_nationality_type" id="g-nat">
                      <option value="libyan">ليبي</option><option value="foreigner">أجنبي</option>
                    </select>
                  </div>
                  <div style="margin-bottom:13px;display:none;" id="g-natname-wrap">
                    <label class="mq-label">اسم الجنسية <span style="color:#B23A48;">*</span></label>
                    <input class="mq-input" name="guardian_nationality_name" placeholder="مثال: مصر">
                    <div class="mq-field-error" data-error="guardian_nationality_name"></div>
                  </div>
                </div>
                <div style="margin-bottom:13px;">
                  <label class="mq-label" id="g-idlabel">الرقم الوطني لولي الأمر (اختياري)</label>
                  <input class="mq-input" name="guardian_id_number" placeholder="مثال: 199000000001">
                  <div style="font-size:12px;color:#7A8F82;margin-top:4px;" id="g-idhelp">المعرّف الأساسي لتمييز ولي الأمر (يربط الإخوة بحساب واحد) — لو ليبي: رقم وطني 12 رقماً.</div>
                  <div class="mq-field-error" data-error="guardian_id_number"></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  ${inp('guardian_phone', 'هاتف ولي الأمر')}
                  ${inp('guardian_password', 'كلمة المرور', { type: 'password', help: 'إن تُركت: password' })}
                </div>
              </div>

              <div id="gm-existing" style="display:none;">
                <div style="position:relative;">
                  <input class="mq-input" id="parent-search" autocomplete="off" placeholder="ابحث باسم ولي الأمر أو رقم هاتفه...">
                  <div id="parent-dd" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:30;background:#fff;border:1px solid rgba(4,83,47,.2);border-radius:12px;margin-top:5px;max-height:240px;overflow-y:auto;box-shadow:0 18px 44px -16px rgba(4,54,31,.5);"></div>
                </div>
                <div id="parent-chip" style="display:none;margin-top:10px;"></div>
                <div class="mq-field-error" data-error="parent_id"></div>
              </div>

              <div id="gm-none" style="display:none;color:#7A8F82;font-size:13px;background:#FBF9EE;border-radius:10px;padding:11px 14px;">سيُسجَّل الطالب بدون ولي أمر (يمكن ربطه لاحقاً).</div>

              <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:18px;">
                <button type="button" class="mq-btn mq-btn-outline" data-close>إلغاء</button>
                <button type="submit" class="mq-btn mq-btn-primary">حفظ الطالب</button>
              </div>
            </form>
          </div>`;
        document.body.appendChild(ov);
        const close = () => ov.remove();
        ov.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
        ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });

        // تبديل الأوضاع
        const secNew = ov.querySelector('#gm-new'), secEx = ov.querySelector('#gm-existing'), secNone = ov.querySelector('#gm-none');
        ov.querySelectorAll('input[name="gmode"]').forEach(r => r.onchange = () => {
            const m = ov.querySelector('input[name="gmode"]:checked').value;
            secNew.style.display = m === 'new' ? 'block' : 'none';
            secEx.style.display = m === 'existing' ? 'block' : 'none';
            secNone.style.display = m === 'none' ? 'block' : 'none';
        });

        // إظهار «اسم الجنسية» وتغيير تسمية حقل الرقم عند اختيار «أجنبي»
        function wireNat(selId, wrapId, labelId, helpId, libLabel, forLabel, libHelp, forHelp) {
            const sel = ov.querySelector('#' + selId), wrap = ov.querySelector('#' + wrapId);
            const label = ov.querySelector('#' + labelId), help = ov.querySelector('#' + helpId);
            const apply = () => {
                const foreign = sel.value === 'foreigner';
                wrap.style.display = foreign ? 'block' : 'none';
                label.textContent = foreign ? forLabel : libLabel;
                help.textContent = foreign ? forHelp : libHelp;
            };
            sel.onchange = apply; apply();
        }
        wireNat('s-nat', 's-natname-wrap', 's-idlabel', 's-idhelp',
            'الرقم الوطني (اختياري)', 'رقم الجواز/الإقامة (اختياري)',
            NAT_ID_HELP, 'رقم جواز/إقامة الطالب الأجنبي — نص حرّ بلا صيغة ليبية.');
        wireNat('g-nat', 'g-natname-wrap', 'g-idlabel', 'g-idhelp',
            'الرقم الوطني لولي الأمر (اختياري)', 'رقم الجواز/الإقامة لولي الأمر (اختياري)',
            'المعرّف الأساسي لتمييز ولي الأمر (يربط الإخوة بحساب واحد) — لو ليبي: رقم وطني 12 رقماً.',
            'رقم جواز/إقامة ولي الأمر — يميّزه بدقّة ويربط أبناءه بحساب واحد.');

        // قائمة المحفّظ تابعة للمركز (تبدأ معطّلة حتى يُختار مركز)
        wireTeacherByCenter(ov, null);

        // بحث ولي أمر موجود (debounced)
        const psearch = ov.querySelector('#parent-search'), pdd = ov.querySelector('#parent-dd'), pchip = ov.querySelector('#parent-chip');
        let t = null, last = 0;
        psearch.addEventListener('input', () => {
            clearTimeout(t);
            const q = psearch.value.trim();
            chosenParent = null; pchip.style.display = 'none';
            if (q.length < 2) { pdd.style.display = 'none'; return; }
            t = setTimeout(async () => {
                const rid = ++last;
                try {
                    const res = await API.get('/parents/search?q=' + encodeURIComponent(q));
                    if (rid !== last) return;
                    const items = res.data || [];
                    if (!items.length) { pdd.innerHTML = '<div style="padding:10px 13px;color:#9DB3A6;font-size:13px;">لا يوجد ولي أمر مطابق</div>'; pdd.style.display = 'block'; return; }
                    pdd.innerHTML = items.map((p, i) => `
                        <div class="pitem" data-i="${i}" style="padding:10px 13px;cursor:pointer;border-bottom:1px solid rgba(4,54,31,.06);">
                          <div style="font-weight:700;color:#04361F;font-size:14px;">${UI.escapeHtml(p.name)}</div>
                          <div style="font-size:12px;color:#7A8F82;margin-top:2px;">📞 ${UI.escapeHtml(p.phone || '—')} · 👨‍👧‍👦 عدد الأبناء: ${p.children_count}</div>
                        </div>`).join('');
                    pdd.querySelectorAll('.pitem').forEach(el => el.onmousedown = (e) => {
                        e.preventDefault();
                        const p = items[+el.dataset.i];
                        chosenParent = p;
                        psearch.value = '';
                        pdd.style.display = 'none';
                        pchip.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px;background:rgba(4,83,47,.1);border:1px solid rgba(4,83,47,.25);color:#04532F;border-radius:30px;padding:7px 14px;font-size:13px;font-weight:700;">
                            ✓ ${UI.escapeHtml(p.name)} — ${UI.escapeHtml(p.phone || '')} (${p.children_count} أبناء)
                            <button type="button" id="clear-parent" style="background:none;border:none;color:#B23A48;cursor:pointer;font-size:16px;">×</button></span>`;
                        pchip.style.display = 'block';
                        pchip.querySelector('#clear-parent').onclick = () => { chosenParent = null; pchip.style.display = 'none'; };
                    });
                    pdd.style.display = 'block';
                } catch (e) { pdd.style.display = 'none'; }
            }, 300);
        });
        psearch.addEventListener('blur', () => setTimeout(() => pdd.style.display = 'none', 150));

        // الحفظ
        ov.querySelector('#add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            ov.querySelectorAll('[data-error]').forEach(el => el.textContent = '');
            const f = e.target;
            const v = {
                name: f.name.value, national_id: f.national_id.value || null,
                nationality_type: f.nationality_type.value,
                nationality_name: f.nationality_type.value === 'foreigner' ? (f.nationality_name.value || null) : null,
                center_id: f.center_id.value, teacher_id: f.teacher_id.value || null,
                age: f.age.value || null, phone: f.phone.value || null,
            };
            const mode = ov.querySelector('input[name="gmode"]:checked').value;
            if (mode === 'new') {
                v.guardian_name = f.guardian_name.value || null;
                v.guardian_email = f.guardian_email.value || null;
                v.guardian_phone = f.guardian_phone.value || null;
                v.guardian_password = f.guardian_password.value || null;
                v.guardian_nationality_type = f.guardian_nationality_type.value;
                v.guardian_nationality_name = f.guardian_nationality_type.value === 'foreigner' ? (f.guardian_nationality_name.value || null) : null;
                v.guardian_id_number = f.guardian_id_number.value || null;
            } else if (mode === 'existing') {
                if (!chosenParent) { ov.querySelector('[data-error="parent_id"]').textContent = 'اختر ولي أمر من نتائج البحث'; return; }
                v.parent_id = chosenParent.id;
            }
            const btn = f.querySelector('button[type="submit"]'); btn.disabled = true;
            try {
                await API.post('/students', v);
                UI.toast('تم إضافة الطالب بنجاح');
                close(); load();
            } catch (err) {
                if (err.errors) Object.keys(err.errors).forEach(k => { const b = ov.querySelector(`[data-error="${k}"]`); if (b) b.textContent = err.errors[k][0]; });
                UI.toast(err.message || 'تعذّر الحفظ', 'danger');
                btn.disabled = false;
            }
        });
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const [cRes, tRes] = await Promise.all([API.get('/centers?all=1'), API.get('/teachers?all=1')]);
            centers = cRes.data.data || cRes.data || [];
            teachers = tRes.data.data || tRes.data || [];

            const centerFilterOpts = '<option value="">كل المراكز</option>' +
                centers.map(c => `<option value="${c.id}">${UI.escapeHtml(c.name)}</option>`).join('');

            pc.innerHTML = `
                <div id="stu-banner"></div>
                <div class="mq-card" style="margin-bottom:16px;"><div class="mq-card-body" style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;">
                  <div style="flex:1;min-width:150px;">
                    <label class="mq-label" style="font-size:12.5px;">المركز</label>
                    <select class="mq-input" id="f-center">${centerFilterOpts}</select>
                  </div>
                  <div style="flex:1;min-width:150px;">
                    <label class="mq-label" style="font-size:12.5px;">المعلم</label>
                    <select class="mq-input" id="f-teacher" disabled><option value="">كل المعلمين</option></select>
                  </div>
                  <div style="flex:1;min-width:130px;">
                    <label class="mq-label" style="font-size:12.5px;">الجنسية</label>
                    <select class="mq-input" id="f-nat"><option value="">كل الجنسيات</option><option value="libyan">ليبي</option><option value="foreigner">أجنبي</option></select>
                  </div>
                  <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#3D6B52;font-weight:600;cursor:pointer;white-space:nowrap;padding-bottom:9px;">
                    <input type="checkbox" id="f-missing" style="width:17px;height:17px;accent-color:#9A7A1E;cursor:pointer;"> بلا رقم وطني فقط
                  </label>
                  <button class="mq-btn mq-btn-outline" id="f-clear" style="padding:9px 16px;">مسح الفلاتر</button>
                </div></div>
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="بحث بالاسم أو ولي الأمر..."></div>
                  <button class="mq-btn mq-btn-primary" id="add">${UI.ic('plus', 17)} طالب جديد</button>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>الطالب</th><th>الرقم الوطني</th><th>المركز</th><th>المعلم</th><th>العمر</th><th>الإجراءات</th></tr></thead>
                  <tbody id="stu-body"><tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">جارٍ التحميل...</td></tr></tbody>
                </table></div>`;

            const fCenter = document.getElementById('f-center'), fTeacher = document.getElementById('f-teacher');
            const fNat = document.getElementById('f-nat'), fMissing = document.getElementById('f-missing');

            function rowsHtml(students) {
                return students.map(s => `
                    <tr>
                      <td><div style="display:flex;align-items:center;gap:10px;">
                        <span class="mq-avatar">${UI.initial(s.name)}</span>
                        <div><div style="font-weight:600;">${UI.escapeHtml(s.name)}</div>
                        <div style="font-size:12px;color:#9DB3A6;">${UI.escapeHtml(s.guardian_name || '')}</div></div></div></td>
                      <td>${s.national_id
                          ? `<span style="direction:ltr;display:inline-block;font-weight:600;color:#04532F;">${UI.escapeHtml(s.national_id)}</span>${s.nationality_type === 'foreigner' ? ' ' + UI.badge(UI.escapeHtml(s.nationality_name || 'أجنبي'), 'warning') : ''}`
                          : `<span class="mq-badge mq-badge-warning">⚠ بدون رقم وطني</span>`}</td>
                      <td>${UI.badge(UI.escapeHtml(s.center?.name || '—'), 'info')}</td>
                      <td>${s.teacher ? UI.escapeHtml(s.teacher.name) : (s.teacher_id === null ? '<span style="color:#9A7A1E;">محفّظ سابق</span>' : '—')}</td>
                      <td>${s.age ?? '—'}</td>
                      <td><div class="mq-actions">
                        ${UI.actionBtn('edit', `data-edit="${s.id}"`)}
                        ${UI.actionBtn('del', `data-del="${s.id}"`)}
                      </div></td>
                    </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">لا يوجد طلاب مطابقون للفلاتر</td></tr>`;
            }

            function updateBanner(students) {
                const missing = students.filter(s => !s.national_id).length;
                document.getElementById('stu-banner').innerHTML = missing > 0
                    ? `<div style="display:flex;align-items:center;gap:10px;background:rgba(212,175,55,.16);color:#9A7A1E;border-right:4px solid #9A7A1E;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;margin-bottom:16px;">
                         ⚠️ ${missing} من ${students.length} طالباً (بالعرض الحالي) بلا رقم وطني — يُنصح بإكمالها قبل تقارير الأوقاف.</div>`
                    : `<div style="display:flex;align-items:center;gap:10px;background:rgba(4,83,47,.08);color:#04532F;border-right:4px solid #04532F;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;margin-bottom:16px;">
                         ✓ كل الطلاب (بالعرض الحالي) لديهم رقم وطني — جاهزة لتقارير الأوقاف.</div>`;
            }

            function bindRowActions(students) {
                const body = document.getElementById('stu-body');
                body.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
                    const s = students.find(x => x.id == b.dataset.edit);
                    UI.formModal({ title: 'تعديل / نقل الطالب', submitText: 'حفظ', fields: editFields(s),
                        onMount: (form) => { wireEditNat(form); wireTeacherByCenter(form, s.teacher_id); },
                        onSubmit: async (v, h) => { await API.put('/students/' + s.id, v); UI.toast('تم التحديث'); h.close(); renderStudents(); } });
                });
                body.querySelectorAll('[data-del]').forEach(b => b.onclick = () =>
                    UI.confirmDelete('حذف هذا الطالب؟', async () => { await API.del('/students/' + b.dataset.del); UI.toast('تم الحذف'); renderStudents(); }));
            }

            // قائمة معلّمي المركز المختار للفلتر (الفلترة نفسها في الـ Backend)
            async function fillFilterTeachers(centerId) {
                if (!centerId) { fTeacher.innerHTML = '<option value="">كل المعلمين</option>'; fTeacher.disabled = true; return; }
                fTeacher.disabled = true; fTeacher.innerHTML = '<option value="">جارٍ...</option>';
                try {
                    const res = await API.get('/teachers?all=1&center_id=' + centerId);
                    const list = res.data.data || res.data || [];
                    fTeacher.innerHTML = '<option value="">كل المعلمين</option>' + list.map(t => `<option value="${t.id}">${UI.escapeHtml(t.name)}</option>`).join('');
                } catch (e) { fTeacher.innerHTML = '<option value="">كل المعلمين</option>'; }
                fTeacher.disabled = false;
            }

            // إعادة جلب الطلاب مفلترين (center_id/teacher_id/nationality/missing) — كلها AND في الـ Backend
            async function renderStudents() {
                const p = new URLSearchParams({ all: '1' });
                if (fCenter.value) p.set('center_id', fCenter.value);
                if (fTeacher.value) p.set('teacher_id', fTeacher.value);
                if (fNat.value) p.set('nationality', fNat.value);
                if (fMissing.checked) p.set('missing_national_id', '1');
                const body = document.getElementById('stu-body');
                body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:20px;">جارٍ التحميل...</td></tr>`;
                try {
                    const res = await API.get('/students?' + p.toString());
                    const students = res.data.data || res.data || [];
                    body.innerHTML = rowsHtml(students);
                    updateBanner(students);
                    bindRowActions(students);
                    const s = document.getElementById('search'); if (s.value.trim()) s.dispatchEvent(new Event('input'));
                } catch (e) { body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#B23A48;padding:20px;">${UI.escapeHtml(e.message)}</td></tr>`; }
            }

            UI.bindTableSearch('search', 'tbl');
            fCenter.onchange = () => { fillFilterTeachers(fCenter.value); renderStudents(); };
            fTeacher.onchange = renderStudents;
            fNat.onchange = renderStudents;
            fMissing.onchange = renderStudents;
            document.getElementById('f-clear').onclick = () => {
                fCenter.value = ''; fNat.value = ''; fMissing.checked = false;
                fTeacher.innerHTML = '<option value="">كل المعلمين</option>'; fTeacher.disabled = true;
                document.getElementById('search').value = '';
                renderStudents();
            };
            document.getElementById('add').onclick = openAddStudent;

            renderStudents();
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>
