<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المدير | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'dashboard', title: 'لوحة تحكم المدير' });

    try {
        const res = await API.get('/dashboard');
        const d = res.data;
        const s = d.stats;

        const stat = (val, lbl, ico, kind) => `
            <div class="mq-stat ${kind}"><span class="mq-stat-ico">${UI.star(22)}</span>
              <div><div class="mq-stat-val">${val}</div><div class="mq-stat-lbl">${lbl}</div></div></div>`;

        const recent = (d.recentStudents || []).map(st => `
            <tr><td><div style="display:flex;align-items:center;gap:10px;">
              <span class="mq-avatar">${UI.initial(st.name)}</span>${UI.escapeHtml(st.name)}</div></td>
              <td>${UI.escapeHtml(st.teacher?.name || '—')}</td>
              <td>${UI.escapeHtml(st.center?.name || '—')}</td></tr>`).join('') ||
            `<tr><td colspan="3" style="text-align:center;color:#7A8F82;padding:24px;">لا يوجد طلاب</td></tr>`;

        const teachers = (d.teachers || []).map(t => `
            <tr><td><div style="display:flex;align-items:center;gap:10px;">
              <span class="mq-avatar">${UI.initial(t.name)}</span>
              <div><div style="font-weight:600;">${UI.escapeHtml(t.name)}</div>
              <div style="font-size:12px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(t.email)}</div></div></div></td>
              <td>${UI.badge((t.students_count ?? 0) + ' طالب', 'primary')}</td></tr>`).join('') ||
            `<tr><td colspan="2" style="text-align:center;color:#7A8F82;padding:24px;">لا يوجد معلمون</td></tr>`;

        pc.innerHTML = `
            <div class="mq-toolbar" style="justify-content:flex-end;">
              <button class="mq-btn mq-btn-gold" id="import" style="gap:7px;">${UI.ic('upload', 17)} رفع ملف الحضور</button>
            </div>
            <div class="mq-stats">
              ${stat(s.total_teachers, 'المعلمون', '👨‍🏫', 'green')}
              ${stat(s.total_students, 'الطلاب', '👥', 'gold')}
              ${stat(s.total_centers, 'المراكز', '🏫', 'blue')}
              ${stat(s.today_present, 'حاضر اليوم', '✅', 'green')}
              ${stat(s.today_absent, 'غائب اليوم', '❌', 'red')}
              ${stat(s.today_late, 'متأخر اليوم', '⏰', 'orange')}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
              <div class="mq-card">
                <div class="mq-card-header"><h3 class="mq-card-title">آخر الطلاب المضافين</h3>
                  <a class="mq-btn mq-btn-outline mq-btn-sm" href="students.html">عرض الكل</a></div>
                <table class="mq-table"><thead><tr><th>الطالب</th><th>المعلم</th><th>المركز</th></tr></thead>
                  <tbody>${recent}</tbody></table>
              </div>
              <div class="mq-card"><div class="mq-card-body">
                <h3 class="mq-card-title" style="margin-bottom:18px;">روابط سريعة</h3>
                <div class="mq-quick-grid">
                  <a class="mq-quick" href="students.html"><span class="mq-quick-ico">${UI.ic('students', 20)}</span><span>تسجيل طالب جديد</span></a>
                  <a class="mq-quick" href="teachers.html"><span class="mq-quick-ico">${UI.ic('teachers', 20)}</span><span>إضافة معلم</span></a>
                  <a class="mq-quick" href="centers.html"><span class="mq-quick-ico">${UI.ic('centers', 20)}</span><span>إضافة مركز</span></a>
                  <a class="mq-quick" href="students.html"><span class="mq-quick-ico">${UI.ic('report', 20)}</span><span>جميع الطلاب</span></a>
                </div>
              </div></div>
            </div>`;
        document.getElementById('import').onclick = () => UI.runAttendanceImport();
    } catch (e) { UI.toast(e.message, 'danger'); }
})();
</script>
</body>
</html>
