<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراكز | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'centers', title: 'إدارة المراكز' });

    const fields = (c = {}) => [
        { name: 'name', label: 'اسم المركز', required: true, value: c.name },
        { name: 'city', label: 'المدينة', value: c.city, placeholder: 'مثال: طرابلس، بنغازي' },
        { name: 'address', label: 'العنوان', value: c.address },
        { name: 'phone', label: 'رقم الهاتف', value: c.phone },
    ];

    // قائمة المدن المميّزة (تُشتق من كل المراكز؛ الفلترة نفسها تتم في الـ Backend)
    let allCities = [];

    function rowsHtml(centers) {
        return centers.map(c => `
            <tr>
              <td style="font-weight:600;">${UI.escapeHtml(c.name)}</td>
              <td>${c.city ? UI.badge(UI.escapeHtml(c.city), 'primary') : '—'}</td>
              <td>${UI.escapeHtml(c.address || '—')}</td>
              <td>${UI.escapeHtml(c.phone || '—')}</td>
              <td>${UI.badge((c.students_count ?? 0) + ' طالب', 'info')}</td>
              <td><div class="mq-actions">
                ${UI.actionBtn('edit', `data-edit="${c.id}"`)}
                ${UI.actionBtn('del', `data-del="${c.id}"`)}
              </div></td>
            </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:30px;">لا توجد مراكز</td></tr>`;
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            // تحميل أولي لكل المراكز لاشتقاق قائمة المدن
            const res0 = await API.get('/centers?all=1');
            const initial = res0.data.data || res0.data || [];
            allCities = [...new Set(initial.map(c => c.city).filter(Boolean))].sort();
            const cityOpts = '<option value="">كل المدن</option>' +
                allCities.map(city => `<option value="${UI.escapeHtml(city)}">${UI.escapeHtml(city)}</option>`).join('');

            pc.innerHTML = `
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="بحث بالاسم..."></div>
                  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <label class="mq-label" style="margin:0;font-size:13px;white-space:nowrap;">المدينة:</label>
                      <select class="mq-input" id="city-filter" style="max-width:200px;">${cityOpts}</select>
                    </div>
                    <button class="mq-btn mq-btn-primary" id="add">${UI.ic('plus', 17)} مركز جديد</button>
                  </div>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>اسم المركز</th><th>المدينة</th><th>العنوان</th><th>الهاتف</th><th>الطلاب</th><th>الإجراءات</th></tr></thead>
                  <tbody id="ctr-body">${rowsHtml(initial)}</tbody></table></div>`;

            const cityFilter = document.getElementById('city-filter');

            async function renderCenters(city) {
                const body = document.getElementById('ctr-body');
                body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#7A8F82;padding:20px;">جارٍ التحميل...</td></tr>`;
                try {
                    const res = await API.get('/centers?all=1' + (city ? '&city=' + encodeURIComponent(city) : ''));
                    const centers = res.data.data || res.data || [];
                    body.innerHTML = rowsHtml(centers);
                    bindRowActions(centers);
                    const s = document.getElementById('search'); if (s.value.trim()) s.dispatchEvent(new Event('input'));
                } catch (e) { body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#B23A48;padding:20px;">${UI.escapeHtml(e.message)}</td></tr>`; }
            }

            function bindRowActions(centers) {
                const body = document.getElementById('ctr-body');
                body.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
                    const c = centers.find(x => x.id == b.dataset.edit);
                    UI.formModal({ title: 'تعديل المركز', submitText: 'حفظ التعديلات', fields: fields(c),
                        onSubmit: async (v, h) => { await API.put('/centers/' + c.id, v); UI.toast('تم التحديث'); h.close(); load(); } });
                });
                body.querySelectorAll('[data-del]').forEach(b => b.onclick = () =>
                    UI.confirmDelete('حذف هذا المركز؟', async () => { await API.del('/centers/' + b.dataset.del); UI.toast('تم الحذف'); load(); }));
            }

            UI.bindTableSearch('search', 'tbl');
            bindRowActions(initial);
            cityFilter.onchange = () => renderCenters(cityFilter.value);
            document.getElementById('add').onclick = () => UI.formModal({
                title: 'إضافة مركز', fields: fields(),
                onSubmit: async (v, h) => { await API.post('/centers', v); UI.toast('تم إضافة المركز'); h.close(); load(); }
            });
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>
