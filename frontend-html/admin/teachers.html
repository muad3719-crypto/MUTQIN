<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المعلمون | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['admin']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'teachers', title: 'إدارة المعلمين' });
    let centers = [];

    const typeOpts = [{ value: 'محفظ أساسي', label: 'محفظ أساسي' }, { value: 'محفظ معاون', label: 'محفظ معاون' }];
    const centerOpts = () => centers.map(c => ({ value: c.id, label: c.name }));

    function addFields() {
        return [
            { name: 'name', label: 'الاسم الكامل', required: true },
            { name: 'email', label: 'البريد الإلكتروني', type: 'email', required: true },
            { name: 'phone', label: 'رقم الهاتف' },
            { name: 'center_id', label: 'المركز', type: 'select', required: true, options: centerOpts() },
            { name: 'type', label: 'نوع المحفظ', type: 'select', required: true, options: typeOpts },
            { name: 'password', label: 'كلمة المرور', type: 'password', required: true },
            { name: 'password_confirmation', label: 'تأكيد كلمة المرور', type: 'password', required: true },
        ];
    }
    function editFields(t) {
        return [
            { name: 'name', label: 'الاسم الكامل', required: true, value: t.name },
            { name: 'email', label: 'البريد الإلكتروني', type: 'email', required: true, value: t.email },
            { name: 'phone', label: 'رقم الهاتف', value: t.phone },
            { name: 'center_id', label: 'المركز', type: 'select', required: true, options: centerOpts(), value: t.center_id },
            { name: 'type', label: 'نوع المحفظ', type: 'select', required: true, options: typeOpts, value: t.type },
            { name: 'password', label: 'كلمة مرور جديدة (اختياري)', type: 'password' },
            { name: 'password_confirmation', label: 'تأكيد كلمة المرور', type: 'password' },
        ];
    }

    // قاعدة: محفّظ أساسي واحد لكل مركز — يعطّل خيار «محفظ أساسي» في الواجهة إن كان للمركز أساسي.
    // ignoreId: معرّف المحفّظ عند التعديل (لا نعطّل الخيار إن كان هو نفسه أساسي المركز).
    function wireSinglePrimary(ignoreId) {
        return (form) => {
            const centerSel = form.querySelector('[name="center_id"]');
            const typeSel = form.querySelector('[name="type"]');
            if (!centerSel || !typeSel) return;
            const primaryOpt = Array.from(typeSel.options).find(o => o.value === 'محفظ أساسي');
            const hintBox = form.querySelector('[data-error="type"]');

            async function refresh() {
                if (!centerSel.value) return;
                try {
                    const res = await API.get('/centers/' + centerSel.value + '/has-primary');
                    const d = res.data || {};
                    const taken = d.has_primary && !(ignoreId && d.primary_teacher && d.primary_teacher.id == ignoreId);
                    if (primaryOpt) {
                        primaryOpt.disabled = taken;
                        if (taken && typeSel.value === 'محفظ أساسي') typeSel.value = 'محفظ معاون';
                    }
                    if (hintBox) {
                        hintBox.style.color = '#9A7A1E';
                        hintBox.textContent = taken
                            ? 'لهذا المركز محفّظ أساسي (' + (d.primary_teacher?.name || '') + ') — يمكن إضافة معاونين فقط.'
                            : '';
                    }
                } catch (e) { /* تجاهل: الـ Backend يفرض القاعدة على أي حال */ }
            }
            centerSel.addEventListener('change', refresh);
            refresh();
        };
    }

    // خلية معلومة (عنوان صغير + قيمة) لنافذة التفاصيل
    function infoCell(label, val) {
        return `<div><div style="font-size:12px;color:#7A8F82;margin-bottom:2px;">${label}</div>
            <div style="font-weight:600;">${UI.escapeHtml(val)}</div></div>`;
    }

    // نافذة «تفاصيل المحفّظ» — للقراءة فقط (تجلب من GET /teachers/{id})
    async function showTeacherDetails(id) {
        let d;
        try { const res = await API.get('/teachers/' + id); d = res.data || {}; }
        catch (e) { UI.toast(e.message, 'danger'); return; }

        const students = d.students || [];
        const studentRows = students.length
            ? students.map((s, i) => `<tr>
                  <td style="color:#9DB3A6;">${i + 1}</td>
                  <td style="font-weight:600;">${UI.escapeHtml(s.name)}</td>
                  <td>${s.display_code ? `<span class="mq-code">${UI.escapeHtml(s.display_code)}</span>` : '—'}</td>
                  <td>${s.age ?? '—'}</td></tr>`).join('')
            : `<tr><td colspan="4" style="text-align:center;color:#9DB3A6;padding:16px;">لا يوجد طلاب مسجّلون</td></tr>`;

        // سجل تغييرات كلمة المرور (إن وُجد) — عرض فقط
        const methodLabels = { otp: 'عبر الهاتف (OTP)', self: 'المستخدم نفسه', admin: 'الأدمن' };
        const logs = d.password_logs || [];
        const pwdLogsHtml = logs.length ? `
            <details style="margin-bottom:18px;">
              <summary style="cursor:pointer;font-size:13px;font-weight:700;color:#9A7A1E;">📜 سجل تغييرات كلمة المرور (${logs.length})</summary>
              <table class="mq-table" style="margin-top:8px;">
                <thead><tr><th>التاريخ</th><th>الطريقة</th></tr></thead>
                <tbody>${logs.map(l => `<tr><td>${UI.fmtDate(l.changed_at)}</td><td>${methodLabels[l.method] || l.method}</td></tr>`).join('')}</tbody>
              </table>
            </details>` : '';

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(4,54,31,.45);z-index:1500;display:flex;align-items:center;justify-content:center;padding:24px;';
        overlay.innerHTML = `
            <div class="mq-card" style="width:100%;max-width:600px;max-height:90vh;overflow:auto;margin:0;">
              <div class="mq-card-header"><h3 class="mq-card-title">تفاصيل المحفّظ</h3>
                <button type="button" data-close style="background:none;border:none;font-size:22px;cursor:pointer;color:#7A8F82;">×</button></div>
              <div class="mq-card-body">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
                  <span class="mq-avatar" style="width:52px;height:52px;font-size:20px;">${UI.initial(d.name)}</span>
                  <div><div style="font-weight:700;font-size:17px;">${UI.escapeHtml(d.name || '—')}</div>
                    <div style="font-size:12.5px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(d.email || '—')}</div></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:20px;">
                  ${infoCell('مركز التحفيظ', d.center_name || '—')}
                  ${infoCell('النوع', d.type || '—')}
                  ${infoCell('الهاتف', d.phone || '—')}
                  ${infoCell('عدد الطلاب', (d.students_count ?? students.length) + ' طالب')}
                  ${infoCell('مرات تغيير كلمة المرور', (d.password_changed_count ?? 0) + ' مرة')}
                  ${infoCell('آخر تغيير لكلمة المرور', d.password_last_changed_at ? UI.fmtDate(d.password_last_changed_at) : 'لم تتغيّر')}
                </div>
                ${pwdLogsHtml}
                <div style="font-weight:700;color:#04532F;margin-bottom:8px;">الطلاب المشرف عليهم</div>
                <table class="mq-table">
                  <thead><tr><th style="width:44px;">#</th><th>الاسم</th><th style="width:80px;">الكود</th><th style="width:90px;">العمر</th></tr></thead>
                  <tbody>${studentRows}</tbody>
                </table>
              </div>
            </div>`;
        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
        overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const cRes = await API.get('/centers?all=1&active=1');
            centers = cRes.data.data || cRes.data || [];
            const centerName = (id) => (centers.find(c => c.id == id) || {}).name || '—';

            pc.innerHTML = `
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="ابحث بالاسم أو الكود (T5) أو اسم المركز..."></div>
                  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <label class="mq-label" style="margin:0;font-size:13px;white-space:nowrap;">المركز:</label>
                      <select class="mq-input" id="center-filter" style="max-width:190px;">
                        <option value="">كل المراكز</option>
                        ${centers.map(c => `<option value="${c.id}">${UI.escapeHtml(c.name)}</option>`).join('')}
                      </select>
                    </div>
                    <span id="tea-counter" style="font-size:13px;color:#7A8F82;font-weight:600;white-space:nowrap;"></span>
                    <button class="mq-btn mq-btn--primary" id="add">${UI.ic('plus', 17)} محفّظ جديد</button>
                  </div>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>المحفّظ</th><th style="width:80px;">الكود</th><th>المركز</th><th style="width:110px;text-align:center;">الحالة</th><th style="width:150px;">الإجراءات</th></tr></thead>
                  <tbody id="tea-body"><tr><td colspan="5" style="text-align:center;color:#7A8F82;padding:30px;">جارٍ التحميل...</td></tr></tbody>
                </table></div>
                <div style="text-align:center;margin-top:16px;">
                  <button class="mq-btn mq-btn--secondary" id="load-more" style="display:none;">عرض المزيد ↓</button>
                </div>`;

            const searchInput = document.getElementById('search');
            const counter = document.getElementById('tea-counter');
            const loadMoreBtn = document.getElementById('load-more');
            const centerFilter = document.getElementById('center-filter');

            // ===== ترقيم من الخادم + بحث حي (لا فلترة محلية) =====
            let page = 1, lastPage = 1, total = 0, loadedCount = 0, fetchSeq = 0;

            function bindRowActions(batch) {
                const body = document.getElementById('tea-body');
                batch.forEach(t => {
                    const vb = body.querySelector(`[data-details="${t.id}"]`);
                    if (vb) vb.onclick = () => showTeacherDetails(t.id);
                    const eb = body.querySelector(`[data-edit="${t.id}"]`);
                    if (eb) eb.onclick = () => UI.formModal({ title: 'تعديل المعلم', submitText: 'حفظ التعديلات', fields: editFields(t), onMount: wireSinglePrimary(t.id),
                        onSubmit: async (v, h) => { await API.put('/teachers/' + t.id, v); UI.toast('تم التحديث'); h.close(); renderTeachers(true); } });
                    // تفعيل/تعطيل الحساب — بديل الحذف: التاريخ يبقى كاملاً
                    const tb = body.querySelector(`[data-toggle="${t.id}"]`);
                    if (tb) tb.onclick = async () => {
                        const deact = !!t.is_active; // نحن على وشك التعطيل؟
                        const html = deact
                            ? `تعطيل حساب <strong>${UI.escapeHtml(t.name)}</strong>؟<br>`
                              + `<span style="color:#B23A48;font-weight:700;">لن يستطيع تسجيل الدخول، وتُبطَل جلساته فوراً.</span><br>`
                              + `<span style="color:#7A8F82;">تبقى كل بياناته وسجلّاته وطلابه كما هي — ويمكن إعادة تفعيله لاحقاً.</span>`
                            : `تفعيل حساب <strong>${UI.escapeHtml(t.name)}</strong>؟<br>`
                              + `<span style="color:#7A8F82;">سيتمكّن من تسجيل الدخول مجدداً.</span>`;
                        const ok = await UI.confirmAction({
                            title: deact ? 'تعطيل الحساب' : 'تفعيل الحساب',
                            html, okText: deact ? 'تأكيد التعطيل' : 'تأكيد التفعيل', cancelText: 'إلغاء',
                        });
                        if (!ok) return;
                        try {
                            const res = await API.put('/teachers/' + t.id + '/status', { is_active: !t.is_active });
                            UI.toast(res.message || 'تم تحديث الحالة');
                            renderTeachers(true);
                        } catch (e) { UI.toast(e.message, 'danger'); }
                    };
                });
            }

            // reset=true: من الصفحة 1 (بحث/فلتر) — reset=false: إلحاق الصفحة التالية
            async function renderTeachers(reset = true) {
                if (reset) { page = 1; loadedCount = 0; }
                const seq = ++fetchSeq;
                const body = document.getElementById('tea-body');
                if (reset) body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#7A8F82;padding:20px;">جارٍ التحميل...</td></tr>`;
                loadMoreBtn.disabled = true;
                try {
                    const p = new URLSearchParams({ page });
                    const q = searchInput.value.trim();
                    if (q) p.set('q', q); // بحث موحّد: اسم / كود / اسم المركز
                    if (centerFilter.value) p.set('center_id', centerFilter.value); // يتقاطع مع البحث بـ AND في الخادم
                    const res = await API.get('/teachers?' + p.toString());
                    if (seq !== fetchSeq) return; // ردود متأخرة لا تكتب فوق الأحدث
                    const pg = res.data;
                    const batch = pg.data || [];
                    lastPage = pg.last_page ?? 1; total = pg.total ?? batch.length;
                    const rows = batch.map(t => `
                        <tr>
                          <td><div style="display:flex;align-items:center;gap:10px;">
                            <span class="mq-avatar">${UI.initial(t.name)}</span>
                            <div><div style="font-weight:600;">${UI.escapeHtml(t.name)}</div>
                            <div style="font-size:12px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(t.email)}</div></div></div></td>
                          <td>${t.display_code ? `<span class="mq-code">${UI.escapeHtml(t.display_code)}</span>` : '—'}</td>
                          <td>${UI.badge(UI.escapeHtml(centerName(t.center_id)), 'info')}</td>
                          <td style="text-align:center;">${t.is_active
                              ? UI.badge('نشط', 'success')
                              : UI.badge('غير نشط', 'danger')}</td>
                          <td><div class="mq-actions">
                            ${UI.actionBtn('view', `data-details="${t.id}" title="تفاصيل"`)}
                            ${UI.actionBtn('edit', `data-edit="${t.id}" title="تعديل"`)}
                            <button class="mq-btn ${t.is_active ? 'mq-btn--quiet-danger' : 'mq-btn--quiet'} mq-btn--icon mq-btn--sm"
                                    data-toggle="${t.id}" title="${t.is_active ? 'تعطيل الحساب' : 'تفعيل الحساب'}">
                              ${t.is_active
                                ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>'
                                : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>'}
                            </button>
                          </div></td>
                        </tr>`).join('');
                    if (reset) body.innerHTML = batch.length ? rows : `<tr><td colspan="5" style="text-align:center;color:#7A8F82;padding:30px;">لا يوجد معلمون مطابقون</td></tr>`;
                    else body.insertAdjacentHTML('beforeend', rows);
                    loadedCount += batch.length;
                    bindRowActions(batch);
                    counter.textContent = total ? `عرض ${loadedCount} من ${total}` : '';
                    loadMoreBtn.style.display = page < lastPage ? '' : 'none';
                } catch (e) {
                    if (reset) body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#B23A48;padding:20px;">${UI.escapeHtml(e.message)}</td></tr>`;
                } finally { loadMoreBtn.disabled = false; }
            }

            loadMoreBtn.onclick = () => { page++; renderTeachers(false); };

            // بحث حي من الخادم (debounce ~300ms) — يعيد للصفحة 1، ومسحه يعيد الكل
            let searchTimer = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => renderTeachers(true), 300);
            });
            centerFilter.addEventListener('change', () => renderTeachers(true));

            document.getElementById('add').onclick = () => UI.formModal({
                title: 'إضافة معلم', fields: addFields(), onMount: wireSinglePrimary(null),
                onSubmit: async (v, h) => { await API.post('/teachers', v); UI.toast('تم إضافة المعلم'); h.close(); renderTeachers(true); }
            });

            renderTeachers(true);
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>
