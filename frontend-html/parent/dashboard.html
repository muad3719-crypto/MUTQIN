<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أبنائي | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(async function () {
    const user = Auth.requireAuth(['parent']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'dashboard', title: 'متابعة الأبناء' });

    function pctColor(p) { return p >= 75 ? '#04532F' : (p >= 50 ? '#9A7A1E' : '#B23A48'); }

    try {
        const res = await API.get('/parent/children');
        const children = res.data || [];
        if (!children.length) {
            pc.innerHTML = `<div class="mq-empty"><h3>لا يوجد أبناء مسجّلون</h3><p>لم يُربط أي طالب بحسابك بعد. تواصل مع إدارة المركز.</p></div>`;
            return;
        }
        const cards = children.map(c => {
            const p = c.attendance_percent ?? 0;
            return `
            <div class="mq-card" style="cursor:pointer;" onclick="location.href='child.html?id=${c.id}'">
              <div class="mq-card-body">
                <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
                  <span class="mq-avatar" style="width:50px;height:50px;font-size:22px;">${UI.initial(c.name)}</span>
                  <div><h3 style="font-family:'Amiri',serif;font-size:19px;margin:0;color:#04361F;">${UI.escapeHtml(c.name)}</h3>
                    <span style="font-size:12px;color:#7A8F82;">العمر: ${c.age ?? '—'} سنة</span></div>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;margin-bottom:16px;">
                  <div style="display:flex;justify-content:space-between;background:#FBF9EE;border-radius:8px;padding:8px 12px;"><span style="color:#7A8F82;">🏫 المركز</span><span style="font-weight:600;">${UI.escapeHtml(c.center || '—')}</span></div>
                  <div style="display:flex;justify-content:space-between;background:#FBF9EE;border-radius:8px;padding:8px 12px;"><span style="color:#7A8F82;">👨‍🏫 المحفّظ</span><span style="font-weight:600;">${UI.escapeHtml(c.teacher_name || '—')}</span></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                  <div style="text-align:center;padding:10px;background:rgba(4,83,47,.06);border-radius:8px;">
                    <div style="font-size:11px;color:#7A8F82;">📖 آخر سورة</div>
                    <div style="font-weight:700;color:#04532F;">${UI.escapeHtml(c.last_surah || '—')}</div></div>
                  <div style="text-align:center;padding:10px;border-radius:8px;background:${p >= 75 ? 'rgba(4,83,47,.06)' : (p >= 50 ? 'rgba(212,175,55,.14)' : 'rgba(178,58,72,.1)')};">
                    <div style="font-size:11px;color:#7A8F82;">📋 نسبة الحضور</div>
                    <div style="font-weight:700;color:${pctColor(p)};">${p}%</div></div>
                </div>
                <div class="mq-btn mq-btn--primary mq-btn--block" style="margin-top:16px;justify-content:center;">📊 عرض التفاصيل</div>
              </div>
            </div>`;
        }).join('');

        pc.innerHTML = `
            <div class="mq-stats"><div class="mq-stat gold"><span class="mq-stat-ico">${UI.star(22)}</span>
              <div><div class="mq-stat-val">${children.length}</div><div class="mq-stat-lbl">عدد الأبناء</div></div></div></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;">${cards}</div>`;
    } catch (e) { UI.toast(e.message, 'danger'); }
})();
</script>
</body>
</html>
