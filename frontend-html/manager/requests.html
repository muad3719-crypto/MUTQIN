<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات النقل الداخلية | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'requests', title: 'طلبات النقل الداخلية' });
    let statusFilter = 'pending';

    const statusBadge = (s) => s === 'approved' ? UI.badge('معتمد', 'success')
        : s === 'rejected' ? UI.badge('مرفوض', 'danger') : UI.badge('قيد المراجعة', 'warning');

    function openReject(id) {
        UI.formModal({
            title: 'رفض طلب النقل', submitText: 'رفض الطلب',
            fields: [{ name: 'admin_note', label: 'سبب الرفض (اختياري)', type: 'textarea', placeholder: 'مثال: المحفّظ المستهدف مكتمل العدد' }],
            onSubmit: async (v, h) => {
                await API.post('/manager/student-requests/' + id + '/reject', v);
                UI.toast('تم رفض الطلب'); h.close(); load();
            }
        });
    }

    async function approve(id) {
        try {
            await API.post('/manager/student-requests/' + id + '/approve');
            UI.toast('تم اعتماد الطلب وتنفيذ النقل'); load();
        } catch (e) { UI.toast(e.message, 'danger'); }
    }

    async function load() {
        pc.innerHTML = '<div class="mq-card"><div class="mq-card-body">جارٍ التحميل...</div></div>';
        try {
            const res = await API.get('/manager/student-requests?status=' + statusFilter);
            const reqs = res.data || [];
            const rows = reqs.map(r => `
                <tr>
                  <td><div style="font-weight:600;">${UI.escapeHtml(r.student_name || '—')}</div>
                    <div style="font-size:12px;color:#9DB3A6;direction:ltr;text-align:right;">${UI.escapeHtml(r.national_id || '—')}</div></td>
                  <td>${UI.escapeHtml(r.requested_by || '—')}</td>
                  <td>${UI.escapeHtml(r.from_teacher || '—')} ← ${UI.escapeHtml(r.target_teacher || '—')}</td>
                  <td style="white-space:nowrap;">${UI.fmtDate(r.created_at)}</td>
                  <td>${r.status === 'pending'
                        ? `<div class="mq-actions">
                             <button class="mq-btn mq-btn--primary mq-btn--sm" data-approve="${r.id}">اعتماد</button>
                             <button class="mq-btn mq-btn--secondary mq-btn--sm" data-reject="${r.id}">رفض</button>
                           </div>`
                        : statusBadge(r.status) + (r.status === 'rejected' && r.admin_note ? `<div style="font-size:12px;color:#B23A48;margin-top:4px;">${UI.escapeHtml(r.admin_note)}</div>` : '')}</td>
                </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:#7A8F82;padding:30px;">لا توجد طلبات نقل داخلية</td></tr>`;

            const tab = (key, label) => `<button class="mq-btn ${statusFilter === key ? 'mq-btn--primary' : 'mq-btn--secondary'} mq-btn--sm" data-tab="${key}">${label}</button>`;

            pc.innerHTML = `
                <div style="background:#FBF9EE;border:1px solid rgba(4,83,47,.12);border-radius:12px;padding:11px 15px;font-size:13px;color:#3D6B52;margin-bottom:16px;">
                  ℹ️ هذه طلبات النقل <b>بين محفّظي مركزك</b> فقط. النقل العابر للمراكز يُدار من تبويب مستقل (قريباً).
                </div>
                <div class="mq-toolbar">
                  <div class="mq-search">${UI.ic('search', 18, '#9A7A1E')}<input id="search" placeholder="بحث..."></div>
                  <div style="display:flex;gap:8px;">${tab('pending', 'قيد المراجعة')}${tab('all', 'الكل')}</div>
                </div>
                <div class="mq-card"><table class="mq-table" id="tbl">
                  <thead><tr><th>الطالب</th><th>مقدّم الطلب</th><th>من محفّظ ← إلى</th><th>التاريخ</th><th>الإجراء</th></tr></thead>
                  <tbody>${rows}</tbody></table></div>`;

            UI.bindTableSearch('search', 'tbl');
            pc.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { statusFilter = b.dataset.tab; load(); });
            pc.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approve(b.dataset.approve));
            pc.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => openReject(b.dataset.reject));
        } catch (e) { UI.toast(e.message, 'danger'); }
    }
    load();
})();
</script>
</body>
</html>
