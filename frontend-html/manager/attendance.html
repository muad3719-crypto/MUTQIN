<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استيراد الحضور | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
<style>
  .imp-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:stretch;}
  @media(max-width:1024px){.imp-grid{grid-template-columns:1fr;}}

  /* منطقة الرفع — بطاقة بارزة بنمط النجمة الخلفي */
  .imp-drop{position:relative;overflow:hidden;border:2px dashed rgba(4,83,47,.28);border-radius:20px;
    background:
      radial-gradient(700px 300px at 80% -20%, rgba(212,175,55,.12), transparent 60%),
      linear-gradient(180deg,#FFFFFF,#FBF9EE);
    padding:44px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:border-color .2s, box-shadow .2s;min-height:340px;}
  .imp-drop:hover{border-color:var(--gold);box-shadow:0 18px 44px -26px rgba(4,54,31,.4);}
  .imp-drop.dragover{border-color:var(--emerald);background:linear-gradient(180deg,#F1F7F3,#EAF2EC);}
  .imp-ico{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;
    background:rgba(4,83,47,.08);border:1px solid rgba(212,175,55,.4);color:var(--emerald);margin-bottom:20px;}
  .imp-title{font-family:'Amiri',serif;font-size:26px;color:#04361F;margin:0 0 8px;}
  .imp-sub{font-size:14px;color:#7A8F82;margin:0 0 22px;max-width:340px;line-height:1.8;}
  .imp-hint{font-size:12.5px;color:#9A7A1E;font-weight:700;margin-top:14px;}

  /* جدول الأعمدة المطلوبة */
  .fmt-table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .fmt-table th{background:var(--emerald);color:var(--gold);font-size:12.5px;font-weight:700;padding:9px 8px;text-align:center;white-space:nowrap;}
  .fmt-table td{padding:9px 8px;font-size:12.5px;text-align:center;border-bottom:1px solid rgba(4,54,31,.06);color:var(--text);}
  .fmt-table tr:last-child td{border-bottom:none;background:var(--ivory-soft);}

  /* خطوات */
  .imp-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .imp-step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--emerald);color:var(--ivory);
    font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;}
  .imp-step .tx{font-size:13.5px;color:#3D6B52;line-height:1.7;font-weight:500;}
  .imp-step .tx b{color:#04361F;}

  /* بطاقات السلوك الذكي */
  .imp-notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;}
  @media(max-width:767.98px){.imp-notes{grid-template-columns:1fr;}}
  .imp-note{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:16px;display:flex;gap:11px;align-items:flex-start;box-shadow:var(--shadow);}
  .imp-note .ni{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .imp-note h4{font-size:14px;color:#04361F;margin:0 0 3px;font-weight:800;}
  .imp-note p{font-size:12.5px;color:#7A8F82;margin:0;line-height:1.7;}
</style>
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'attendance', title: 'استيراد حضور البصمة' });

    pc.innerHTML = `
        <div class="imp-grid">
          <!-- منطقة الرفع -->
          <div class="imp-drop" id="drop">
            <span class="imp-ico">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V5M8 9l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </span>
            <h2 class="imp-title">استيراد ملف حضور البصمة</h2>
            <p class="imp-sub">اسحب ملف <b style="color:#04532F;">xlsx.</b> هنا أو اضغط الزر لاختياره من جهازك — ويُعالَج فوراً بمطابقة أكواد الطلاب.</p>
            <button class="mq-btn mq-btn--primary mq-btn--lg" id="import-btn">
              ${UI.ic('upload', 18)} اختيار الملف والاستيراد
            </button>
            <div class="imp-hint">صيغة xlsx. فقط · الحجم الأقصى 5 ميجابايت</div>
          </div>

          <!-- الدليل: الأعمدة + الخطوات -->
          <div class="mq-card"><div class="mq-card-body">
            <h3 style="font-family:'Amiri',serif;font-size:20px;color:#04361F;margin:0 0 12px;">📋 الأعمدة المطلوبة (بالترتيب)</h3>
            <table class="fmt-table">
              <thead><tr><th>رقم الطالب</th><th>الاسم</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th></tr></thead>
              <tbody><tr><td>121</td><td>محمد أحمد</td><td>2026-07-22</td><td>07:15</td><td>حاضر</td></tr></tbody>
            </table>
            <p style="font-size:12.5px;color:#9A7A1E;font-weight:600;margin:9px 0 22px;">💡 «رقم الطالب» = الرقم في جهاز البصمة، وهو الجزء الرقمي من كود الطالب (S121 → 121).</p>

            <h3 style="font-family:'Amiri',serif;font-size:20px;color:#04361F;margin:0 0 14px;">🗂️ كيف يعمل</h3>
            <div class="imp-step"><span class="n">١</span><span class="tx">صدّر ملف الحضور من <b>جهاز البصمة</b> بالأعمدة أعلاه.</span></div>
            <div class="imp-step"><span class="n">٢</span><span class="tx">ارفعه من هنا — يُطابَق كل سطر بالطالب عبر <b>رقمه</b>، ويُعرض تقرير فوري.</span></div>
            <div class="imp-step"><span class="n">٣</span><span class="tx">راجع <b>التحذيرات والصفوف المرفوضة</b> في التقرير وصحّح الجهاز إن لزم.</span></div>
          </div></div>
        </div>

        <!-- السلوك الذكي -->
        <div class="imp-notes">
          <div class="imp-note"><span class="ni" style="background:rgba(42,111,142,.12);color:#2A6F8E;">🎯</span>
            <div><h4>مقصور على مركزك</h4><p>السطور الخاصة بطلاب من خارج مركزك تُتجاهَل تلقائياً.</p></div></div>
          <div class="imp-note"><span class="ni" style="background:rgba(178,58,72,.1);color:#B23A48;">📅</span>
            <div><h4>احتساب الغياب</h4><p>من لم يظهر في الملف من طلاب مركزك يُحتسب غائباً في تواريخه.</p></div></div>
          <div class="imp-note"><span class="ni" style="background:rgba(4,83,47,.1);color:#04532F;">🔄</span>
            <div><h4>لا تكرار</h4><p>الحضور المكرّر لنفس اليوم يُحدّث السجل الموجود لا يُضاعفه.</p></div></div>
        </div>`;

    const run = () => UI.runAttendanceImport(null, '/manager/attendance/import');
    document.getElementById('import-btn').onclick = run;

    // سحب وإفلات الملف على المنطقة
    const drop = document.getElementById('drop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('dragover'); }));
    drop.addEventListener('drop', e => {
        const f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        if (!f.name.toLowerCase().endsWith('.xlsx')) { UI.toast('يجب أن يكون الملف بصيغة xlsx.', 'danger'); return; }
        const fd = new FormData(); fd.append('attendance_file', f);
        UI.toast('جارٍ رفع الملف ومعالجته...', 'info');
        window.API.upload('/manager/attendance/import', fd)
            .then(res => { if (window.UI.importSummaryModal) UI.importSummaryModal(res); else run(); })
            .catch(err => UI.toast(err.message || 'تعذّر رفع الملف', 'danger'));
    });
})();
</script>
</body>
</html>
