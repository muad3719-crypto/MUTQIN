<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استيراد الحضور | مُتقِن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="../css/theme.css" rel="stylesheet">
</head>
<body>
<div id="app-shell"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
    const user = Auth.requireAuth(['center_manager']);
    if (!user) return;
    const pc = Layout.mount({ user, active: 'attendance', title: 'استيراد حضور البصمة' });

    pc.innerHTML = `
        <div class="mq-card" style="max-width:640px;">
          <div class="mq-card-header"><h3 class="mq-card-title">📥 استيراد ملف البصمة (xlsx)</h3></div>
          <div class="mq-card-body">
            <p style="color:#3D6B52;font-size:14px;line-height:1.9;">
              ارفع ملف جهاز البصمة الخاص بمركزك. الأعمدة المطلوبة بالترتيب:
              <b>رقم الطالب | الاسم | التاريخ | الوقت | الحالة</b>.<br>
              السطور الخاصة بطلاب من خارج مركزك تُتجاهَل تلقائياً، ومن لم يظهر في الملف
              من طلاب مركزك يُحتسب غائباً في تواريخ الملف.
            </p>
            <button class="mq-btn mq-btn-primary" id="import-btn" style="margin-top:10px;">
              ${UI.ic('attendance', 18)} اختيار الملف والاستيراد
            </button>
          </div>
        </div>`;

    document.getElementById('import-btn').onclick = () =>
        UI.runAttendanceImport(null, '/manager/attendance/import');
})();
</script>
</body>
</html>
